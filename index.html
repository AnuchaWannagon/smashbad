<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smash Badminton">
<title>Smash Badminton Club</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B1020;
  --bg2:#0F1730;
  --card:#161F38;
  --card2:#1D2846;
  --line:#27335A;
  --ink:#EDF1FF;
  --ink-soft:#93A0C4;
  --lime:#C6F24E;
  --lime-dark:#9CCB2E;
  --blue:#5B8CFF;
  --coral:#FF6B5E;
  --amber:#FFC24B;
  --green:#3ED598;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
html,body{margin:0; padding:0; overflow-x:hidden; max-width:100vw;}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.disp{ font-family:'Prompt',sans-serif; }
button{ font-family:'Noto Sans Thai',sans-serif; cursor:pointer; }
input,select{ font-family:'Noto Sans Thai',sans-serif; }

/* ---------- shared ---------- */
.wrap{ max-width:720px; margin:0 auto; padding:0 16px 90px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.card h3{ margin:0 0 12px; font-size:18px; font-weight:800; color:var(--lime); letter-spacing:.01em; display:flex; align-items:center; gap:8px; border-left:4px solid var(--lime); padding-left:10px; }
.muted{ color:var(--ink-soft); font-size:13.5px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.btn{ border:none; border-radius:12px; padding:13px 20px; font-weight:700; font-size:15.5px; }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.45; }
.btn-lime{ background:var(--lime); color:#15230A; }
.btn-blue{ background:var(--blue); color:#fff; }
.btn-ghost{ background:var(--card2); color:var(--ink); border:1px solid var(--line); }
.btn-danger{ background:rgba(255,107,94,.15); color:var(--coral); border:1px solid rgba(255,107,94,.35); }
.btn-sm{ padding:10px 14px; font-size:14px; border-radius:10px; }
.btn-block{ width:100%; }
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%; background:var(--bg2); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15.5px;
}
textarea{ font-family:'Noto Sans Thai',sans-serif; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--blue); }
label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field{ margin-bottom:12px; }
.frow{ display:flex; gap:10px; } .frow .field{ flex:1; }
.tag{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:999px; }
.tag-admin{ background:rgba(255,194,75,.15); color:var(--amber); border:1px solid rgba(255,194,75,.4); }
.tag-mgr{ background:rgba(91,140,255,.15); color:var(--blue); border:1px solid rgba(91,140,255,.4); }
.tag-open{ background:rgba(198,242,78,.13); color:var(--lime); border:1px solid rgba(198,242,78,.35); }
.tag-play{ background:rgba(255,194,75,.13); color:var(--amber); border:1px solid rgba(255,194,75,.35); }
.tag-done{ background:rgba(147,160,196,.13); color:var(--ink-soft); border:1px solid var(--line); }
.tag-paid{ background:rgba(62,213,152,.13); color:var(--green); border:1px solid rgba(62,213,152,.4); cursor:pointer; }
.tag-unpaid{ background:rgba(255,107,94,.13); color:var(--coral); border:1px solid rgba(255,107,94,.4); cursor:pointer; }
.tag-pending{ background:rgba(255,194,75,.13); color:var(--amber); border:1px solid rgba(255,194,75,.45); }
.slip-img{ width:100%; max-height:52vh; object-fit:contain; border-radius:12px; border:1px solid var(--line); background:var(--bg2); }
.banner-due{ background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.45); color:var(--coral); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; cursor:pointer; }
.banner-approve{ background:rgba(62,213,152,.1); border:1px solid rgba(62,213,152,.5); color:var(--green); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; cursor:pointer; }
.banner-due.nudged{ animation:pulseDue 1.6s ease-in-out infinite; }
@keyframes pulseDue{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,94,0); } 50%{ box-shadow:0 0 0 4px rgba(255,107,94,.22); } }
/* ตัวบอกว่าแอปกำลังทำงาน (ซิงก์เบื้องหลัง) */
.spin{ display:inline-block; animation:spinCw 1.4s linear infinite; }
@keyframes spinCw{ to{ transform:rotate(360deg); } }
.boot-sync{ display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(91,140,255,.12); border:1px solid rgba(91,140,255,.4); color:var(--blue); border-radius:12px; padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:12px; }
.boot-dots::after{ content:""; animation:dots 1.5s steps(4,end) infinite; }
@keyframes dots{ 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }
.chip{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px 8px 8px; border-radius:999px; background:var(--card2); border:1.5px solid var(--line); font-size:15px; font-weight:600; cursor:pointer; user-select:none; }
.chip .av{ width:28px; height:28px; border-radius:50%; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:15px; }
.chip.on{ border-color:var(--lime); background:rgba(198,242,78,.1); }
.chip.on::after{ content:"✓"; color:var(--lime); font-weight:800; }
.chip.pa{ border-color:var(--blue); background:rgba(91,140,255,.12); }
.chip.pa::after{ content:"A"; color:var(--blue); font-weight:800; }
.chip.pb{ border-color:var(--coral); background:rgba(255,107,94,.12); }
.chip.pb::after{ content:"B"; color:var(--coral); font-weight:800; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.empty{ text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:13.5px; }
.empty .big{ font-size:32px; margin-bottom:6px; }
.divider{ height:1px; background:var(--line); margin:14px 0; }
#toast{ position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(16px); background:var(--lime); color:#15230A; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:999; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; transform:translateX(-50%); }
#toast.err{ background:var(--coral); color:#fff; }

/* ---------- login ---------- */
#loginView{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; background:
  radial-gradient(600px 320px at 80% -10%, rgba(91,140,255,.25), transparent),
  radial-gradient(500px 300px at 0% 100%, rgba(198,242,78,.12), transparent), var(--bg); }
.logo-badge{ width:74px; height:74px; border-radius:22px; background:linear-gradient(140deg, var(--lime), var(--lime-dark)); display:flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:14px; box-shadow:0 10px 30px rgba(198,242,78,.25); }
#loginView h1{ margin:0 0 2px; font-size:26px; font-weight:800; letter-spacing:-.01em; }
#loginView .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
.login-panel{ width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
.member-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; max-height:46vh; overflow-y:auto; }
.mg-item{ background:var(--card2); border:1.5px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; }
.mg-item:hover{ border-color:var(--blue); }
.mg-item .em{ font-size:28px; }
.mg-item .nm{ font-size:14.5px; font-weight:700; margin-top:3px; word-break:break-word; }
.mg-item .rl{ font-size:9.5px; color:var(--amber); font-weight:700; }
.pin-dots{ display:flex; gap:12px; justify-content:center; margin:16px 0; }
.pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); }
.pin-dot.fill{ background:var(--lime); border-color:var(--lime); }
.pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.pin-key{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 0; font-size:19px; font-weight:700; color:var(--ink); font-family:'Prompt',sans-serif; }
.pin-key:active{ background:var(--bg2); }
.next-banner{ background:linear-gradient(150deg, rgba(198,242,78,.14), rgba(91,140,255,.10)); border:1.5px solid rgba(198,242,78,.45); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
.next-banner .nb-t{ font-family:'Prompt',sans-serif; font-weight:800; font-size:14px; color:var(--lime); display:flex; align-items:center; gap:8px; }
.next-banner .nb-d{ font-family:'Prompt',sans-serif; font-weight:800; font-size:17px; margin:3px 0 1px; }
.next-banner .nb-n{ margin-top:6px; font-size:13.5px; }
.next-banner .nb-n b{ color:var(--lime); font-size:16px; }

/* ---------- app shell ---------- */
#appView{ display:none; }
.topbar{ position:sticky; top:0; z-index:50; background:rgba(11,16,32,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:720px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand .b-ic{ width:36px; height:36px; border-radius:11px; background:linear-gradient(140deg,var(--lime),var(--lime-dark)); display:flex; align-items:center; justify-content:center; font-size:19px; }
.brand .b-t{ font-family:'Prompt',sans-serif; font-weight:800; font-size:15px; line-height:1.1; }
.brand .b-s{ font-size:10.5px; color:var(--ink-soft); }
.mecap{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; cursor:pointer; }
.mecap .av{ width:26px; height:26px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:14px; }
.mecap .nm{ font-size:13px; font-weight:700; max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.exitbtn{ display:flex; align-items:center; gap:5px; padding:8px 13px; border-radius:999px; background:rgba(255,107,94,.14); border:1px solid rgba(255,107,94,.4); font-size:15px; flex-shrink:0; color:var(--coral); font-weight:800; }
.exitbtn span{ font-size:12.5px; font-family:'Prompt',sans-serif; }
.exitbtn:active{ transform:scale(.95); }
.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(15,23,48,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); }
.bottomnav-in{ max-width:720px; margin:0 auto; display:flex; }
.bn-item{ flex:1; background:none; border:none; padding:9px 4px 10px; text-align:center; color:var(--ink-soft); font-size:12px; font-weight:700; }
.bn-item .ic{ font-size:25px; display:block; margin-bottom:2px; filter:grayscale(1) opacity(.65); }
.bn-item.on{ color:var(--lime); }
.bn-item.on .ic{ filter:none; }
.view{ display:none; padding-top:16px; }
.view.on{ display:block; animation:fade .22s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(5px);} to{opacity:1;} }

/* ---------- ตัวบอกขั้นตอนนัดตี ---------- */
.stepper{ display:flex; gap:5px; margin:0 0 14px; }
.step{ flex:1; text-align:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:7px 2px 6px; line-height:1.25; cursor:pointer; user-select:none; }
.step:active{ transform:scale(.96); }
.step .s-n{ display:block; font-family:'Prompt',sans-serif; font-size:15px; font-weight:800; }
.step.cur{ color:#15230A; background:var(--lime); border-color:var(--lime); }
.step.done{ color:var(--lime); border-color:rgba(198,242,78,.55); background:rgba(198,242,78,.08); }

/* ---------- เมนูหลักปุ่มใหญ่ ---------- */
.menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.menu-btn{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 8px 14px; color:var(--ink); font-weight:800; font-size:15px; font-family:'Prompt',sans-serif; display:flex; flex-direction:column; align-items:center; gap:6px; }
.menu-btn:active{ transform:scale(.97); }
.menu-btn .mi{ font-size:32px; line-height:1; }

/* ---------- session hero ---------- */
.sess-hero{ position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(150deg,#17223F,#101832); padding:18px; margin-bottom:14px; }
.sess-hero::before{ content:""; position:absolute; right:-30px; top:-30px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(198,242,78,.14), transparent 70%); }
.sess-date{ font-family:'Prompt',sans-serif; font-size:23px; font-weight:800; margin:6px 0 2px; color:#fff; text-shadow:0 0 24px rgba(198,242,78,.25); }
.big-join{ margin-top:14px; width:100%; border:none; border-radius:14px; padding:17px; font-size:18px; font-weight:800; font-family:'Prompt',sans-serif; }
.court-reco{ display:flex; align-items:center; gap:12px; background:rgba(198,242,78,.08); border:1px dashed rgba(198,242,78,.4); border-radius:13px; padding:12px 14px; margin-top:14px; }
.court-reco .n{ font-family:'Prompt',sans-serif; font-size:30px; font-weight:800; color:var(--lime); line-height:1; }
.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.statbox{ background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
.statbox .v{ font-family:'Prompt',sans-serif; font-size:23px; font-weight:800; }
.statbox .l{ font-size:12px; color:var(--ink-soft); }

/* set cards */
.set-card{ background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:9px; }
.set-teams{ display:flex; align-items:center; gap:8px; }
.set-team{ flex:1; text-align:center; font-size:12.5px; font-weight:700; word-break:break-word; }
.set-team.w{ color:var(--lime); }
.set-score{ font-family:'Prompt',sans-serif; font-size:21px; font-weight:800; white-space:nowrap; }
.set-meta{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:5px; }
.court-line{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
.court-line:last-child{ border-bottom:none; }

/* summary */
.sum-total{ text-align:center; background:linear-gradient(150deg,#1A2645,#131C36); border:1px solid var(--line); border-radius:15px; padding:16px; margin-bottom:12px; }
.sum-total .n{ font-family:'Prompt',sans-serif; font-size:36px; font-weight:800; color:var(--lime); }
table.tbl{ width:100%; border-collapse:collapse; font-size:14.5px; table-layout:auto; }
table.tbl td{ word-break:break-word; }
table.tbl th{ text-align:left; color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); }
table.tbl td{ padding:8px 4px; border-bottom:1px solid var(--line); }
table.tbl tr:last-child td{ border-bottom:none; }
.mvp-band{ display:flex; align-items:center; gap:12px; background:rgba(255,194,75,.1); border:1.5px solid rgba(255,194,75,.35); border-radius:13px; padding:14px 16px; margin-bottom:12px; animation:mvpGlow 1.6s ease-in-out infinite; }
@keyframes mvpGlow{
 0%,100%{ box-shadow:0 0 0 0 rgba(255,194,75,0); border-color:rgba(255,194,75,.35); }
 50%{ box-shadow:0 0 20px 3px rgba(255,194,75,.4); border-color:rgba(255,194,75,.95); }
}
.mvp-star{ font-size:36px; line-height:1; animation:mvpPop 2.2s ease-in-out infinite; }
@keyframes mvpPop{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.2) rotate(10deg); } }
.mvp-cap{ font-weight:800; font-family:'Prompt',sans-serif; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; }
.mvp-name{ font-family:'Prompt',sans-serif; font-size:26px; font-weight:800; line-height:1.3; color:var(--amber); text-shadow:0 0 12px rgba(255,194,75,.6); animation:mvpBlink 1.3s ease-in-out infinite; }
@keyframes mvpBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.5; } }
@media (prefers-reduced-motion:reduce){ .mvp-band,.mvp-star,.mvp-name{ animation:none; } }

/* ranking */
.rank-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.rank-row:last-child{ border-bottom:none; }
.rank-no{ font-family:'Prompt',sans-serif; font-weight:800; width:26px; text-align:center; color:var(--ink-soft); }
.rank-no.r1{ color:var(--amber); font-size:17px; }
.rank-no.r2{ color:#C9D4F2; font-size:15px; }
.rank-no.r3{ color:#D8905F; font-size:15px; }
.rank-av{ width:34px; height:34px; border-radius:50%; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; }
.wbar{ height:5px; border-radius:99px; background:var(--bg2); overflow:hidden; margin-top:4px; }
.wbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--lime)); border-radius:99px; }

/* member list */
.mem-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.mem-row:last-child{ border-bottom:none; }

/* modal */
.modal-bg{ position:fixed; inset:0; background:rgba(4,7,16,.72); display:none; align-items:flex-end; justify-content:center; z-index:100; }
.modal-bg.show{ display:flex; }
.modal{ background:var(--card); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:720px; max-height:90vh; overflow-y:auto; padding:20px 18px 26px; animation:up .22s ease; }
@keyframes up{ from{ transform:translateY(26px); opacity:0;} to{ transform:none; opacity:1;} }
@media(min-width:560px){ .modal-bg{ align-items:center; padding:20px; } .modal{ border-radius:20px; } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-head h3{ margin:0; font-size:18.5px; font-weight:800; color:var(--lime); }
.mclose{ background:var(--card2); border:1px solid var(--line); color:var(--ink); width:30px; height:30px; border-radius:50%; font-size:14px; }
.emoji-grid{ display:flex; flex-wrap:wrap; gap:6px; }
.emoji-opt{ width:38px; height:38px; border-radius:11px; border:1.5px solid var(--line); background:var(--card2); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.emoji-opt.sel{ border-color:var(--lime); background:rgba(198,242,78,.12); }
.banner-warn{ background:rgba(255,194,75,.12); border:1px solid rgba(255,194,75,.4); color:var(--amber); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; }
.sess-item{ padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.sess-item:last-child{ border-bottom:none; }
/* ---------- จอมือถือแคบ: บีบให้พอดีจอ ไม่ล้นแนวนอน ---------- */
@media(max-width:440px){
  .wrap{ padding:0 10px 90px; }
  .card{ padding:13px; }
  .card h3{ font-size:17px; }
  .topbar-in{ padding:10px 10px; gap:6px; }
  .brand .b-s{ display:none; }
  .brand .b-t{ font-size:13.5px; }
  .brand .b-ic{ width:30px; height:30px; font-size:16px; border-radius:9px; }
  .mecap{ padding:4px 8px 4px 5px; }
  .mecap .nm{ max-width:64px; }
  .mecap .tag{ display:none; }
  .exitbtn{ padding:7px 10px; font-size:14px; }
  .exitbtn span{ font-size:11px; }
  table.tbl{ font-size:12.5px; }
  table.tbl th{ font-size:11px; }
  table.tbl td{ padding:7px 3px; }
  .tag{ font-size:11px; padding:3px 8px; }
  .step{ font-size:10px; padding:6px 1px 5px; }
  .step .s-n{ font-size:13px; }

function stepClick(n, sid) {
  if (!sid) {
    if (n === 1 && canOpenSession()) openNewSession();
    return;
  }
  const s = db.sessions.find(x => x.id === sid);
  if (!s) return;
  if (!canManage(s)) return toast("เฉพาะ Admin หรือผู้จัดการนัดที่แก้ไขขั้นตอนได้");
  if (n === 1) {
    openEditSession(sid);
    return;
  }
  if (n === 2) {
    if (s.status === "playing") return stepBack(sid);
    return toast("อยู่ในขั้นลงชื่อแล้ว — แตะขั้นที่ 1 เพื่อแก้กำหนดการ");
  }
  if (n === 3) {
    openStartPlay(sid);
    return;
  }
  if (n === 4) {
    if (s.status === "playing") return finishSession(sid);

function setWinner(st) {
  const a = Number(st.scoreA),
    b = Number(st.scoreB);
  if (a === b) return null;
  return a > b ? "A" : "B";
}
function courtCost(s) {
  return (s.courts || []).reduce((t, c) => t + (Number(c.hours) || 0) * (Number(c.price) || 0), 0);
}
function shuttleCost(s) {
  return (Number(s.shuttlePrice) || 0) * (Number(s.shuttlesUsed) || 0);
}
function totalCost(s) {
  return courtCost(s) + shuttleCost(s);
}
function costSplit(s) {
  const out = {};
  const att = s.attendees || [];
  if (att.length === 0) return out;
  const total = totalCost(s);
  if (s.costMode === "hours") {
    const sum = att.reduce((t, a) => t + (Number(a.hours) || 0), 0);
    if (sum > 0) {
      att.forEach(a => out[a.memberId] = total * (Number(a.hours) || 0) / sum);
      return out;
    }
  }
  att.forEach(a => out[a.memberId] = total / att.length);
  return out;
}
function sessionStats(s) {
  const st = {};
  (s.attendees || []).forEach(a => st[a.memberId] = {
    w: 0,
    l: 0,
    sets: 0
  });
  (s.sets || []).forEach(x => {
    const w = setWinner(x);
    if (!w) return;
    const win = w === "A" ? x.teamA : x.teamB;
    const lose = w === "A" ? x.teamB : x.teamA;
    win.forEach(id => {
      if (!st[id]) st[id] = {
        w: 0,
        l: 0,
        sets: 0
      };
      st[id].w++;
      st[id].sets++;
    });
    lose.forEach(id => {
      if (!st[id]) st[id] = {
        w: 0,
        l: 0,
        sets: 0
      };
      st[id].l++;
      st[id].sets++;
    });
  });
  return st;
}
function sessionMVP(s) {
  const st = sessionStats(s);
  let max = 0;
  Object.values(st).forEach(v => {
    if (v.w > max) max = v.w;
  });
  if (max === 0) return [];
  return Object.keys(st).filter(id => st[id].w === max);
}

async function pinKey(k) {
  if (k === "del") {
    pinBuf = pinBuf.slice(0, -1);
    renderLogin();
    return;
  }
  if (pinBuf.length >= 4) return;
  pinBuf += k;
  renderLogin();
  if (pinBuf.length < 4) return;
  const m = mem(loginPick);
  await new Promise(r => setTimeout(r, 120));
  if (pinStage === "set") {
    pinFirst = pinBuf;
    pinBuf = "";
    pinStage = "confirm";
    renderLogin();
    return;
  }
  if (pinStage === "confirm") {
    if (pinBuf === pinFirst) {
      m.pin = pinBuf;
      await storeSave();
      loginDone();
    } else {
      toast("PIN ไม่ตรงกัน ลองใหม่อีกครั้ง", true);
      pinBuf = "";
      pinFirst = "";
      pinStage = "set";
      renderLogin();
    }
    return;
  }
  if (pinBuf === m.pin) {
    loginDone();

    toast("PIN ไม่ถูกต้อง", true);

    renderLogin();
  }

  const info = [["🏸 Smash Badminton Club — ไฟล์ข้อมูลคู่แอป"], [""], ["ไฟล์นี้ถูกสร้างโดยแอป smashbadminton-app.html โดยอัตโนมัติ"], ["ชีต Member / Sessions / Sets / Cost มีไว้เปิดดูใน Excel (สร้างจากข้อมูลจริงในแอป)"], ["ชีต AppData คือข้อมูลดิบของแอป — ห้ามแก้ไข มิฉะนั้นจะนำข้อมูลกลับเข้าแอปไม่ได้"], ["วิธีนำข้อมูลกลับเข้าแอป: เปิดแอป → แท็บนัดตี → การจัดการก๊วน → นำเข้าข้อมูลจาก Excel"], [""], ["ส่งออกเมื่อ", new Date().toLocaleString("th-TH")]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), "อ่านก่อน");
  const cs = careerStats();
  const ranked = [...cs].filter(x => x.sets > 0).sort((a, b) => b.wr - a.wr || b.w - a.w);
  const memRows = [["Code", "Member", "Win", "Lose", "Win Rate", "Rank"]];
  db.members.forEach(m => {
    const c = cs.find(x => x.id === m.id) || {
      w: 0,
      l: 0,
      sets: 0,
      wr: null
    };
    const rk = ranked.findIndex(x => x.id === m.id);
    memRows.push([m.id, m.name, c.w, c.l, c.sets > 0 ? Math.round(c.wr * 1000) / 1000 : "", rk >= 0 ? rk + 1 : ""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(memRows), "Member");
  const sesRows = [["วันที่", "สถานที่", "เวลา", "ผู้จัดการ", "สถานะ", "จำนวนคน", "จำนวนเซ็ต", "ลูกที่ใช้", "ค่าคอร์ท (฿)", "ค่าลูก (฿)", "รวมทั้งหมด (฿)", "วิธีหาร"]];
  [...db.sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    sesRows.push([s.date, s.loc || "", s.time || "", nameOf(s.managerId), STATUS_TH[s.status] || s.status, s.attendees.length, (s.sets || []).length, s.shuttlesUsed || 0, courtCost(s), shuttleCost(s), totalCost(s), s.costMode === "hours" ? "ตามชั่วโมงเล่น" : "หารเท่ากัน"]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sesRows), "Sessions");
  const setRows = [["วันที่", "คอร์ท", "ทีม A", "คะแนน A", "ทีม B", "คะแนน B", "ผู้ชนะ", "เปลี่ยนลูก", "ผู้บันทึก"]];
  [...db.sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    (s.sets || []).forEach(x => {
      const w = setWinner(x);
      setRows.push([s.date, x.court, x.teamA.map(nameOf).join(" + "), x.scoreA, x.teamB.map(nameOf).join(" + "), x.scoreB, w ? (w === "A" ? x.teamA : x.teamB).map(nameOf).join(" + ") : "-", x.shuttle ? "ใช่" : "", nameOf(x.recordedBy)]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(setRows), "Sets");
  const costRows = [["วันที่", "สมาชิก", "ชั่วโมงเล่น", "ยอดที่ต้องจ่าย (฿)", "จ่ายแล้ว"]];
  [...db.sessions].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    const split = costSplit(s);
    s.attendees.forEach(a => {
      costRows.push([s.date, nameOf(a.memberId), a.hours || "", Math.round((split[a.memberId] || 0) * 100) / 100, s.paid && s.paid[a.memberId] ? "✓" : ""]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(costRows), "Cost");
  const json = JSON.stringify(db);
  const chunks = [];
  for (let i = 0; i < json.length; i += 30000) chunks.push([json.slice(i, i + 30000)]);
  const appRows = [[APPDATA_MARK], ["ห้ามแก้ไขชีตนี้ — ใช้สำหรับนำข้อมูลกลับเข้าแอป"], ...chunks];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(appRows), "AppData");
  return wb;
}
function exportExcel(auto) {
  if (!xlsxReady()) {
    toast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต", true);
    return;
  }
  try {
    XLSX.writeFile(buildWorkbook(), XLSX_FILE);
    toast(auto ? "📥 บันทึกลงไฟล์ Excel อัตโนมัติแล้ว (เช็คโฟลเดอร์ดาวน์โหลด)" : "📥 บันทึกไฟล์ Excel แล้ว");
  } catch (e) {
    if (!auto) toast("บันทึก Excel ไม่สำเร็จ: " + e.message, true);
  }
}
async function importExcel(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  if (!(isAdmin() || isDefaultMgr())) return toast("เฉพาะ Admin หรือผู้จัดการที่นำเข้าข้อมูลได้", true);
  if (!xlsxReady()) return toast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต", true);
  try {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf);
    const ws = wb.Sheets["AppData"];
    if (!ws) return toast("ไฟล์นี้ไม่มีชีต AppData — ต้องเป็นไฟล์ที่แอปนี้บันทึกไว้", true);
    const rows = XLSX.utils.sheet_to_json(ws, {
      header: 1
    });
    if (!rows.length || String(rows[0][0]) !== APPDATA_MARK) return toast("รูปแบบชีต AppData ไม่ถูกต้อง", true);
    const json = rows.slice(2).map(r => r[0] == null ? "" : String(r[0])).join("");
    const parsed = JSON.parse(json);
    if (!Array.isArray(parsed.members) || !Array.isArray(parsed.sessions)) return toast("ข้อมูลในไฟล์ไม่สมบูรณ์", true);
    if (!confirm("นำเข้าข้อมูลจาก Excel?\nข้อมูลปัจจุบันในแอปจะถูกแทนที่ด้วยข้อมูลในไฟล์\n(สมาชิก " + parsed.members.length + " คน, นัด " + parsed.sessions.length + " นัด)")) return;
    parsed.rev = Math.max(parsed.rev || 0, db.rev || 0);
    db = parsed;
    if (!db.settings) db.settings = {};
    await storeSave();
    if (meId && !mem(meId)) {
      toast("นำเข้าสำเร็จ — บัญชีที่ล็อกอินไม่อยู่ในข้อมูลใหม่ กรุณาล็อกอินอีกครั้ง");
      logout();
      return;
    }
    renderAll();
    toast("📤 นำเข้าข้อมูลจาก Excel สำเร็จ");
  } catch (e) {
    toast("นำเข้าไม่สำเร็จ: " + e.message, true);
  }
}

function openPayHistory() {

async function setCostMode(sid, mode) {
  const s = db.sessions.find(x => x.id === sid);
  if (!s || !canManage(s)) return;
  s.costMode = mode;
  await storeSave();
  modal(renderPaymentHtml(s));
  renderAll();
}
async function setAttHours(sid, mid, val) {
  const s = db.sessions.find(x => x.id === sid);
  if (!s) return;
  const a = s.attendees.find(a => a.memberId === mid);
  if (a) a.hours = Number(val) || 0;
  await storeSave();
  modal(renderPaymentHtml(s));
  renderAll();
}
async function togglePaid(sid, mid) {
  const s = db.sessions.find(x => x.id === sid);
  if (!s) return;
  if (!canManage(s)) return;
  if (!s.paid) s.paid = {};
  s.paid[mid] = !s.paid[mid];
  if (s.paid[mid]) {
    if (!s.payInfo) s.payInfo = {};
    if (!s.payInfo[mid]) s.payInfo[mid] = {
      method: "manual",
      at: Date.now(),
      approvedBy: meId
    };
    if (s.payReq) delete s.payReq[mid];
    if (s.payNudge) delete s.payNudge[mid];
  } else {
    if (s.payInfo) delete s.payInfo[mid];
  }
  await storeSave();
  modal(renderPaymentHtml(s));
  renderAll();
}
function payAmt(s, mid) {
  return costSplit(s)[mid] || 0;
}

function compressImage(file, maxW, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxW / img.width);
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * sc));
        cv.height = Math.max(1, Math.round(img.height * sc));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function loadTesseract() {

  window.__tessLoading = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js";
    sc.onload = () => res(true);
    sc.onerror = () => rej(new Error("load fail"));
    document.head.appendChild(sc);
  });
  return window.__tessLoading;
}
async function ocrSlipAmounts(dataUrl) {

  return [...new Set(nums)];
}

    toast("ลบ " + m.name + " ออกจากก๊วนแล้ว");
  }
}
async function resetPin(id) {
  if (!isAdmin()) return;
  const m = mem(id);
  if (!m) return;
  if (!confirm("รีเซ็ต PIN ของ " + m.name + "? เขาจะตั้ง PIN ใหม่ตอนล็อกอินครั้งถัดไป")) return;
  m.pin = null;
  await storeSave();
  toast("รีเซ็ต PIN ของ " + m.name + " แล้ว");
}
function openProfile() {
  openMemberEdit(meId);
}
function openMemberEdit(id) {
  const m = mem(id);
  if (!m) return;
  const self = id === meId;
  if (!(self || isAdmin())) return toast("แก้ไขได้เฉพาะข้อมูลของตัวเอง (Admin แก้ได้ทุกคน)", true);
  window.__selEmojiP = m.emoji;
  window.__editMemId = id;
  modal("\n    <div class=\"modal-head\"><h3>".concat(self ? "โปรไฟล์ของฉัน" : "แก้ไขข้อมูลสมาชิก (โดย Admin)", "</h3><button class=\"mclose\" onclick=\"closeModal()\">✕</button></div>\n    ").concat(self ? "" : "<p class=\"muted\" style=\"margin-top:0;\">กำลังแก้ไขข้อมูลของ ".concat(m.emoji, " ").concat(esc(m.name), "</p>"), "\n    <div class=\"field\"><label>ชื่อเล่น</label><input type=\"text\" id=\"pfName\" value=\"").concat(esc(m.name), "\"></div>\n    <div class=\"field\"><label>ไอคอนประจำตัว</label><div class=\"emoji-grid\" id=\"pfEmoji\">").concat(EMOJIS.map(e => "<div class=\"emoji-opt ".concat(e === m.emoji ? "sel" : "", "\" onclick=\"pickPfEmoji('").concat(e, "')\">").concat(e, "</div>")).join(""), "</div></div>\n    <div class=\"field\"><label>เบอร์ติดต่อ (ไม่บังคับ)</label><input type=\"text\" id=\"pfPhone\" value=\"").concat(esc(m.phone || ""), "\" placeholder=\"เช่น 081-234-5678\"></div>\n    <div class=\"field\"><label>ข้อมูลเพิ่มเติม (ไม่บังคับ)</label><input type=\"text\" id=\"pfNote\" value=\"").concat(esc(m.note || ""), "\" placeholder=\"เช่น มือ N, ถนัดคู่หน้า, สังกัด อาคาร 3\"></div>\n    <button class=\"btn btn-lime btn-block\" onclick=\"saveMemberEdit()\">บันทึก</button>\n    ").concat(self ? "\n      <div style=\"height:10px;\"></div>\n      <button class=\"btn btn-ghost btn-block\" onclick=\"changeMyPin()\">เปลี่ยน PIN</button>\n      <div style=\"height:10px;\"></div>\n      <button class=\"btn btn-danger btn-block\" onclick=\"logout()\">ออกจากระบบ</button>" : "\n      <div style=\"height:10px;\"></div>\n      <button class=\"btn btn-ghost btn-block\" onclick=\"resetPin('".concat(m.id, "')\">รีเซ็ต PIN ของ ").concat(esc(m.name), "</button>")));
}
function pickPfEmoji(e) {
  window.__selEmojiP = e;
  document.querySelectorAll("#pfEmoji .emoji-opt").forEach(el => el.classList.toggle("sel", el.textContent === e));
}
async function saveMemberEdit() {
  const m = mem(window.__editMemId);
  if (!m) return;
  if (!(m.id === meId || isAdmin())) return;
  const name = $("pfName").value.trim();
  if (!name) return toast("ชื่อห้ามว่าง", true);
  if (db.members.some(x => x.id !== m.id && x.name.toLowerCase() === name.toLowerCase())) return toast("มีชื่อนี้ในก๊วนแล้ว", true);
  m.name = name;
  m.emoji = window.__selEmojiP || m.emoji;
  m.phone = $("pfPhone").value.trim();
  m.note = $("pfNote").value.trim();
  await storeSave();
  closeModal();
  renderAll();
  toast(m.id === meId ? "บันทึกโปรไฟล์แล้ว" : "บันทึกข้อมูลของ " + m.name + " แล้ว");
}
async function changeMyPin() {
  const m = me();
  if (!m) return;
  const p1 = prompt("PIN ใหม่ 4 หลัก:");
  if (p1 === null) return;
  if (!/^\d{4}$/.test(p1)) return toast("PIN ต้องเป็นตัวเลข 4 หลัก", true);
  m.pin = p1;
  await storeSave();
  toast("เปลี่ยน PIN แล้ว");
}
function careerStats() {
  return db.members.map(m => {
    let w = m.baseW || 0,
      l = m.baseL || 0,
      played = 0;
    db.sessions.filter(s => s.status === "done").forEach(s => {
      if (s.attendees.some(a => a.memberId === m.id)) played++;
      const st = sessionStats(s)[m.id];
      if (st) {
        w += st.w;
        l += st.l;
      }
    });
    const sets = w + l;
    return {
      id: m.id,
      name: m.name,
      emoji: m.emoji,
      w,
      l,
      sets,
      played,
      wr: sets > 0 ? w / sets : null
    };
  });
}
function renderRank() {
  const v = $("v-rank");
  const all = careerStats();
  const ranked = all.filter(x => x.sets > 0).sort((a, b) => b.wr - a.wr || b.w - a.w);
  const never = all.filter(x => x.sets === 0);
  const rows = ranked.map((x, i) => "\n    <div class=\"rank-row\" style=\"cursor:pointer;\" onclick=\"openPlayerStats('".concat(x.id, "')\">\n      <div class=\"rank-no ").concat(i < 3 ? "r" + (i + 1) : "", "\">").concat(i < 3 ? ["🥇", "🥈", "🥉"][i] : i + 1, "</div>\n      <div class=\"rank-av\">").concat(x.emoji, "</div>\n      <div style=\"flex:1;\">\n        <div style=\"font-weight:700; font-size:13.5px;\">").concat(esc(x.name), " <span class=\"muted\" style=\"font-size:10.5px;\">👁️ แตะดูรายละเอียด</span></div>\n        <div class=\"wbar\"><i style=\"width:").concat(Math.round(x.wr * 100), "%;\"></i></div>\n      </div>\n      <div style=\"text-align:right;\">\n        <div style=\"font-family:'Prompt',sans-serif; font-weight:800;\">").concat(Math.round(x.wr * 100), "%</div>\n        <div class=\"muted\" style=\"font-size:11px;\">").concat(x.w, "W - ").concat(x.l, "L</div>\n      </div>\n    </div>")).join("");
  v.innerHTML = "\n    <div class=\"card\">\n      <h3>🏆 อันดับก๊วน <span class=\"muted\" style=\"font-weight:400;\">(แตะชื่อดูประวัติรายคน)</span></h3>\n      ".concat(rows || '<div class="empty"><div class="big">🏆</div>ยังไม่มีสถิติ — จบนัดแรกแล้วอันดับจะขึ้นที่นี่</div>', "\n    </div>\n    ").concat(never.length ? "<div class=\"card\"><h3>🌱 ยังไม่มีสถิติ</h3><div class=\"chips\">".concat(never.map(x => "<span class=\"chip\" style=\"cursor:default;\"><span class=\"av\">".concat(x.emoji, "</span>").concat(esc(x.name), "</span>")).join(""), "</div></div>") : "");
}
function openPlayerStats(id) {
  const m = mem(id);
  if (!m) return;
  const c = careerStats().find(x => x.id === id) || {
    w: 0,
    l: 0,
    sets: 0,
    wr: null
  };
  const opp = {},
    par = {},
    items = [];
  db.sessions.filter(s => s.status === "done").sort((a, b) => b.date.localeCompare(a.date)).forEach(s => {
    (s.sets || []).forEach(x => {
      const inA = x.teamA.includes(id),
        inB = x.teamB.includes(id);
      if (!inA && !inB) return;
      const w = setWinner(x);
      const won = w === "A" && inA || w === "B" && inB;
      const myTeam = inA ? x.teamA : x.teamB;
      const others = inA ? x.teamB : x.teamA;
      const myS = inA ? x.scoreA : x.scoreB,
        otS = inA ? x.scoreB : x.scoreA;
      others.forEach(o => {
        if (!opp[o]) opp[o] = {
          w: 0,
          l: 0
        };
        won ? opp[o].w++ : opp[o].l++;
      });
      myTeam.filter(p => p !== id).forEach(p => {
        if (!par[p]) par[p] = {
          w: 0,
          l: 0
        };
        won ? par[p].w++ : par[p].l++;
      });
      items.push({
        date: s.date,
        court: x.court,
        myTeam,
        others,
        myS,
        otS,
        won
      });
    });
  });
  const oppRows = Object.keys(opp).sort((a, b) => opp[b].w + opp[b].l - (opp[a].w + opp[a].l)).map(o => "<tr><td>".concat(emojiOf(o), " ").concat(esc(nameOf(o)), "</td>\n      <td style=\"text-align:center; color:var(--lime); font-weight:700;\">").concat(opp[o].w, "</td>\n      <td style=\"text-align:center; color:var(--coral);\">").concat(opp[o].l, "</td></tr>")).join("");
  const parRows = Object.keys(par).sort((a, b) => par[b].w + par[b].l - (par[a].w + par[a].l)).map(o => "<tr><td>".concat(emojiOf(o), " ").concat(esc(nameOf(o)), "</td>\n      <td style=\"text-align:center; color:var(--lime); font-weight:700;\">").concat(par[o].w, "</td>\n      <td style=\"text-align:center; color:var(--coral);\">").concat(par[o].l, "</td></tr>")).join("");
  const setRows = items.map(it => "\n    <div class=\"set-card\">\n      <div class=\"set-teams\">\n        <div class=\"set-team ".concat(it.won ? "w" : "", "\">").concat(teamLabel(it.myTeam), "</div>\n        <div class=\"set-score\">").concat(it.myS, " : ").concat(it.otS, "</div>\n        <div class=\"set-team ").concat(it.won ? "" : "w", "\">").concat(teamLabel(it.others), "</div>\n      </div>\n      <div class=\"set-meta\">").concat(fmtDateShort(it.date), " • คอร์ท ").concat(esc(it.court), " • ").concat(it.won ? '<span style="color:var(--lime); font-weight:700;">ชนะ</span>' : '<span style="color:var(--coral); font-weight:700;">แพ้</span>', " ").concat(Math.abs(it.myS - it.otS), " แต้ม</div>\n    </div>")).join("");
  modal("\n    <div class=\"modal-head\"><h3>".concat(m.emoji, " สถิติของ ").concat(esc(m.name), "</h3><button class=\"mclose\" onclick=\"closeModal()\">✕</button></div>\n    <div class=\"statgrid\" style=\"margin:0 0 12px;\">\n      <div class=\"statbox\"><div class=\"v\" style=\"color:var(--lime);\">").concat(c.w, "</div><div class=\"l\">ชนะ (เซ็ต)</div></div>\n      <div class=\"statbox\"><div class=\"v\" style=\"color:var(--coral);\">").concat(c.l, "</div><div class=\"l\">แพ้ (เซ็ต)</div></div>\n      <div class=\"statbox\"><div class=\"v\">").concat(c.sets > 0 ? Math.round(c.wr * 100) + "%" : "-", "</div><div class=\"l\">อัตราชนะ</div></div>\n    </div>\n    ").concat(m.baseW || m.baseL ? "<p class=\"muted\" style=\"margin:0 0 10px;\">* รวมยอดยกมาจากไฟล์เดิม ".concat(m.baseW || 0, "W-").concat(m.baseL || 0, "L (ไม่มีรายละเอียดรายเซ็ต)</p>") : "", "\n    ").concat(oppRows ? "<div class=\"card\" style=\"margin-bottom:12px;\"><h3>⚔️ สถิติกับคู่ต่อสู้</h3>\n      <table class=\"tbl\"><tr><th>เจอกับ</th><th style=\"text-align:center;\">ชนะ</th><th style=\"text-align:center;\">แพ้</th></tr>".concat(oppRows, "</table></div>") : "", "\n    ").concat(parRows ? "<div class=\"card\" style=\"margin-bottom:12px;\"><h3>🤝 สถิติกับคู่หู</h3>\n      <table class=\"tbl\"><tr><th>จับคู่กับ</th><th style=\"text-align:center;\">ชนะ</th><th style=\"text-align:center;\">แพ้</th></tr>".concat(parRows, "</table></div>") : "", "\n    <div class=\"card\" style=\"margin-bottom:0;\"><h3>📜 เซ็ตย้อนหลัง (").concat(items.length, ")</h3>\n      ").concat(setRows || '<div class="empty"><div class="big">🏸</div>ยังไม่มีเซ็ตที่บันทึกไว้</div>', "</div>\n    <div style=\"height:12px;\"></div>\n    <button class=\"btn btn-ghost btn-block\" onclick=\"closeModal()\">◀️ ย้อนกลับ</button>"));
}
function renderHistory() {
  const v = $("v-history");
  const done = db.sessions.filter(s => s.status === "done").sort((a, b) => b.date.localeCompare(a.date));
  const rows = done.map(s => {
    const paidCount = s.attendees.filter(a => s.paid && s.paid[a.memberId]).length;
    const mvps = sessionMVP(s);
    return "<div class=\"sess-item\" onclick=\"openSummary('".concat(s.id, "')\">\n      <div class=\"row\">\n        <div>\n          <div style=\"font-weight:700; font-family:'Prompt',sans-serif;\">").concat(fmtDateShort(s.date), "</div>\n          <div class=\"muted\">").concat(s.attendees.length, " คน • ").concat((s.sets || []).length, " เซ็ต • รวม ").concat(money(totalCost(s))).concat(mvps.length ? " • ⭐ " + mvps.map(id => esc(nameOf(id))).join(", ") : "", "</div>\n        </div>\n        <span class=\"tag ").concat(paidCount === s.attendees.length && s.attendees.length > 0 ? "tag-paid" : "tag-unpaid", "\" style=\"cursor:pointer;\">").concat(paidCount, "/").concat(s.attendees.length, " จ่ายแล้ว</span>\n      </div>\n    </div>");
  }).join("");
  v.innerHTML = "<div class=\"card\"><h3>🗂️ ประวัตินัดที่จบแล้ว</h3>".concat(rows || '<div class="empty"><div class="big">🗂️</div>ยังไม่มีนัดที่จบ</div>', "</div>");
}
async function pollRemote() {
  if (modalOpen()) return;
  if (gasUrl() && !clubKey()) return;
  try {
    if (gasUrl()) {
      const remote = await gasLoad();
      if (remote && (remote.rev || 0) > (db.rev || 0)) {
        db = remote;
        if (meId && !mem(meId)) {
          toast("บัญชีของคุณถูกนำออกจากก๊วน", true);
          logout();
          return;
        }
        if (meId) renderAll();else renderLogin();
      }
      updateSyncBadge();
      return;
    }
    if (!storageOK) return;
    const r = await window.storage.get(KEY, true);
    if (r && r.value && r.value !== lastRaw) {
      const incoming = JSON.parse(r.value);
      if ((incoming.rev || 0) >= (db.rev || 0)) {
        lastRaw = r.value;
        db = incoming;
        if (meId && !mem(meId)) {
          toast("บัญชีของคุณถูกนำออกจากก๊วน", true);
          logout();
          return;
        }
        if (meId) renderAll();else renderLogin();
      }
    }
  } catch (e) {}
}
async function init() {
  db = seedDb();
  window.__booting = true;
  if (gasUrl() && !clubKey()) {
    window.__booting = false;
    renderLogin();
    return;
  }
  renderLogin();
  let loaded = null;
  if (gasUrl()) loaded = await gasLoad();
  if (!loaded) {
    const cs = await claudeLoad();
    if (cs) {
      loaded = cs;
      if (!window.__gasOverride && !GAS_URL && cs.settings && cs.settings.gasUrl) {
        window.__gasOverride = cs.settings.gasUrl;
        const g = await gasLoad();
        if (g && (g.rev || 0) >= (cs.rev || 0)) loaded = g;
      }
    }
  }
  window.__booting = false;
  db = loaded || seedDb();
  if (!loaded) await storeSave();
  if ((db.nameSyncV || 0) < NAME_SYNC_V) {
    db.members.forEach(m => {
      if (NAME_SYNC[m.id]) m.name = NAME_SYNC[m.id];
    });
    NAME_SYNC_ADD.forEach(x => {
      if (!db.members.some(m => m.id === x.id || m.name.toLowerCase() === x.name.toLowerCase())) db.members.push({
        id: x.id,
        name: x.name,
        emoji: x.emoji,
        pin: null,
        role: "member",
        baseW: 0,
        baseL: 0
      });
    });
    db.nameSyncV = NAME_SYNC_V;
    await storeSave();
  }
  const nu = db.members.find(m => m.name === ADMIN_NAME);
  if (nu && nu.role !== "admin") {
    nu.role = "admin";
  }
  if (!db.settings) db.settings = {};
  if (!db.settings.defaultManagerId || !mem(db.settings.defaultManagerId)) {
    db.settings.defaultManagerId = nu ? nu.id : db.members[0] && db.members[0].id;
  }
  if ((db.mockV || 0) < 2) {
    DEMO_SESSIONS.forEach(ds => {
      if (!db.sessions.some(s => s.id === ds.id)) db.sessions.push(JSON.parse(JSON.stringify(ds)));
    });
    db.mockV = 2;
    await storeSave();
  }
  if ((db.mockV || 0) < 3) {
    const ds = db.sessions.find(s => s.id === "demo20260806");
    if (ds && !(ds.paid && ds.paid.m5) && !(ds.payReq && ds.payReq.m5)) {
      if (!ds.payReq) ds.payReq = {};
      ds.payReq.m5 = {
        method: "cash",
        at: 1786452000000
      };
    }
    db.mockV = 3;
    await storeSave();
  }
  if ((db.flowV || 0) < 1) {
    const noi = db.members.find(m => m.id === "m7") || db.members.find(m => m.name === "Noi");
    if (noi) db.settings.defaultManagerId = noi.id;
    db.flowV = 1;
    await storeSave();
  }
  updateSyncBadge();
  const savedId = lsGet(LOGIN_KEY);
  if (!meId && savedId && mem(savedId)) {
    meId = savedId;
    $("loginView").style.display = "none";
    $("appView").style.display = "block";
    renderAll();
    toast("สวัสดี " + nameOf(meId) + " " + emojiOf(meId) + " 🏸");
  } else if (savedId && !mem(savedId)) {
    lsDel(LOGIN_KEY);
  }
  if (meId) renderAll();else renderLogin();
  setInterval(pollRemote, 15000);
}
init();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
