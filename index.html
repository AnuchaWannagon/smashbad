function compressImage(file, maxW, quality){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const sc = Math.min(1, maxW/img.width);
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width*sc));
        cv.height = Math.max(1, Math.round(img.height*sc));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", quality));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(true);
  if(window.__tessLoading) return window.__tessLoading;
  window.__tessLoading = new Promise((res, rej)=>{
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js";
    sc.onload = ()=> res(true); sc.onerror = ()=> rej(new Error("load fail"));
    document.head.appendChild(sc);
  });
  return window.__tessLoading;
}
async function ocrSlipAmounts(dataUrl){
  await loadTesseract();
  const r = await Tesseract.recognize(dataUrl, "eng");
  const text = (r && r.data && r.data.text) || "";
  const nums = [...text.matchAll(/\d{1,3}(?:,\d{3})*\.\d{2}|\d+\.\d{2}/g)]
    .map(x=> parseFloat(x[0].replace(/,/g,"")))
    .filter(n=> n>0 && n<1000000);
  return [...new Set(nums)];
}
function openPaySlip(sid, mid){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = ()=> handleSlipFile(sid, inp, mid);
  inp.click();
}
async function handleSlipFile(sid, inp, mid){
  mid = mid || meId;
  const f = inp.files && inp.files[0]; if(!f) return;
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  toast("กำลังเตรียมรูปสลิป…");
  let dataUrl;
  try{
    dataUrl = await compressImage(f, 900, 0.62);
    if(dataUrl.length > 420000) dataUrl = await compressImage(f, 700, 0.5);
    if(dataUrl.length > 420000) return toast("รูปใหญ่เกินไป — ลองครอปเฉพาะส่วนของสลิป", true);
  }catch(e){ return toast("อ่านไฟล์รูปไม่สำเร็จ ลองรูปอื่น", true); }
  const owed = payAmt(s, mid);
  window.__slipDraft = { sid, mid, dataUrl, amountRead:null, matched:false };
  modal(`
    <div class="modal-head"><h3>🧾 ยืนยันสลิปโอนเงิน</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    ${mid!==meId? `<p class="muted" style="margin-top:0;">แนบสลิปแทน <span class="notx">${emojiOf(mid)} ${esc(nameOf(mid))}</span></p>`:""}
    <img src="${dataUrl}" class="slip-img" alt="slip">
    <div class="row" style="margin:10px 0 4px;"><span class="muted">ยอดที่ต้องจ่าย</span><b>${money(owed)}</b></div>
    <div id="slipOcr" class="muted" style="margin-bottom:10px;">🔎 กำลังอ่านยอดเงินจากสลิปอัตโนมัติ… (ส่งได้เลยไม่ต้องรอ)</div>
    <div class="field"><input type="text" id="slipNoteInp" maxlength="80" placeholder="ข้อความถึงผู้จัดการ (ไม่บังคับ) เช่น โอนจากบัญชีแม่ / โอนรวม 2 คน"></div>
    <button class="btn btn-lime btn-block" onclick="submitSlip()">📨 ส่งให้ผู้จัดการอนุมัติ</button>
    <div style="height:8px;"></div>
    <button class="btn btn-ghost btn-block" onclick="closeModal(); openPayment('${sid}');">◀️ ย้อนกลับ</button>`);
  try{
    const nums = await ocrSlipAmounts(dataUrl);
    const d = window.__slipDraft;
    if(!d || d.sid!==sid) return;
    let best = null;
    nums.forEach(n=>{ if(best===null || Math.abs(n-owed) < Math.abs(best-owed)) best = n; });
    d.amountRead = best; d.matched = best!==null && Math.abs(best-owed) < 0.01;
    const el = $("slipOcr");
    if(el){
      if(d.matched) el.innerHTML = `✅ อ่านยอดจากสลิปได้ <b style="color:var(--lime);">${money(best)}</b> — ตรงกับยอดที่ต้องจ่าย`;
      else if(best!==null) el.innerHTML = `⚠️ อ่านยอดจากสลิปได้ ~${money(best)} (ยอดที่ต้องจ่าย ${money(owed)}) — ผู้จัดการจะตรวจอีกครั้ง`;
      else el.textContent = "อ่านยอดอัตโนมัติไม่สำเร็จ — ผู้จัดการจะตรวจจากรูปสลิปแทน";
    }
  }catch(e){
    const el = $("slipOcr");
    if(el) el.textContent = "อ่านยอดอัตโนมัติไม่ได้ (ต้องต่ออินเทอร์เน็ต) — ผู้จัดการจะตรวจจากรูปสลิปแทน";
  }
}

async function approvePay(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  const req = s.payReq && s.payReq[mid]; if(!req) return;
  if(!s.paid) s.paid = {};
  if(!s.payInfo) s.payInfo = {};
  s.paid[mid] = true;
  s.payInfo[mid] = { method:req.method, slip:req.slip||null, amountRead:req.amountRead!=null? req.amountRead:null, note:req.note||"", at:req.at, approvedBy:meId, approvedAt:Date.now() };
  delete s.payReq[mid];
  if(s.payNudge) delete s.payNudge[mid];
  await storeSave(); renderAll(); openPayment(sid);
  toast("✅ อนุมัติแล้ว — "+nameOf(mid)+" จ่ายเรียบร้อย");
}
async function rejectPay(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  if(!confirm("ปฏิเสธรายการนี้? สถานะจะกลับเป็น \"ยังไม่จ่าย\"")) return;
  if(s.payReq) delete s.payReq[mid];
  await storeSave(); renderAll(); openPayment(sid);
  toast("ปฏิเสธแล้ว — สถานะกลับเป็นยังไม่จ่าย");
}
function viewSlip(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const info = s.payInfo && s.payInfo[mid]; if(!info || !info.slip) return;
  modal(`
    <div class="modal-head"><h3>🧾 สลิปของ ${emojiOf(mid)} ${esc(nameOf(mid))}</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <img src="${info.slip}" class="slip-img" alt="slip">
    ${info.note? `<div style="margin:10px 0 0; padding:9px 12px; background:rgba(255,194,75,.1); border:1px dashed rgba(255,194,75,.45); border-radius:11px;">📝 <b class="notx">${esc(info.note)}</b></div>`:""}
    <p class="muted" style="margin:10px 0 12px;">อนุมัติโดย ${emojiOf(info.approvedBy)} ${esc(nameOf(info.approvedBy))}${info.approvedAt? " • "+new Date(info.approvedAt).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}</p>
    <button class="btn btn-ghost btn-block" onclick="openPayment('${sid}')">◀️ ย้อนกลับ</button>`);
}
/* Admin/ผู้จัดการ แตะคนที่ยังไม่จ่าย: ส่งแจ้งเตือน หรือเปลี่ยนสถานะ */

  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  const m = mem(mid); if(!m) return;
  const nudged = s.payNudge && s.payNudge[mid];
  modal(`
    <div class="modal-head"><h3>💸 ${m.emoji} ${esc(m.name)} — ยังไม่จ่าย</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="row" style="margin-bottom:10px;"><span class="muted">ยอดที่ต้องจ่าย (นัด ${fmtDateShort(s.date)})</span><b>${money(payAmt(s,mid))}</b></div>
    ${nudged? `<p class="muted" style="margin-top:0;">📣 ส่งแจ้งเตือนล่าสุดเมื่อ ${new Date(nudged.at).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} โดย ${emojiOf(nudged.by)} ${esc(nameOf(nudged.by))}</p>`:""}

    <button class="btn btn-ghost btn-block" onclick="copyNudgeMsg('${sid}','${mid}')">📋 คัดลอกข้อความทวง → วางในไลน์</button>

    <button class="btn btn-blue btn-block" onclick="togglePaid('${sid}','${mid}')">✓ เปลี่ยนสถานะเป็น "จ่ายแล้ว" (รับเงินแล้ว)</button>

    <button class="btn btn-ghost btn-block" onclick="openPayment('${sid}')">◀️ ย้อนกลับ</button>`);
}
async function sendNudge(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  if(!s.payNudge) s.payNudge = {};
  s.payNudge[mid] = { by:meId, at:Date.now() };
  await storeSave(); renderAll(); openPayment(sid);
  toast("📣 ส่งแจ้งเตือนถึง "+nameOf(mid)+" แล้ว");
}

/* =====================================================
   คัดลอกข้อความไปวางในไลน์กลุ่ม (LINE)
   ===================================================== */
async function copyLine(text){
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok = true; }
  }catch(e){}
  if(!ok){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){}
  }
  if(ok){ toast("📋 คัดลอกแล้ว — เปิดไลน์กลุ่มแล้ววางได้เลย"); return; }
  modal(`
    <div class="modal-head"><h3>📋 คัดลอกข้อความ</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <p class="muted" style="margin-top:0;">คัดลอกอัตโนมัติไม่ได้ — แตะที่ข้อความด้านล่างเพื่อเลือกทั้งหมด แล้วคัดลอกเอง</p>
    <textarea readonly style="width:100%; min-height:180px; background:rgba(255,255,255,.06); color:var(--ink); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px; font-family:inherit; font-size:14px;" onclick="this.select()">${esc(text)}</textarea>
    <div style="height:8px;"></div>
    <button class="btn btn-ghost btn-block" onclick="closeModal()">ปิด</button>`);
}

  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const split = costSplit(s), total = totalCost(s);
  const lines = s.attendees.map(a=>{
    const mid = a.memberId, m = mem(mid); if(!m) return "";
    const paid = !!(s.paid && s.paid[mid]), req = s.payReq && s.payReq[mid];
    const st = LANG==="en"
      ? (paid ? "✅ paid" : req ? "⏳ pending" : "❌ unpaid")

    ? "💰 Cost summary — session " + fmtDate(s.date) + "\n"

      + "รวมทั้งนัด " + money(total) + " (คอร์ท " + money(courtCost(s)) + " + ลูก " + money(shuttleCost(s)) + ")\n\n"
      + lines + "\n\n"
      + "จ่ายเงิน / แนบสลิป ได้ในแอป 👇\n" + APP_URL;

function copyRankSummary(){
  const ranked = careerStats().filter(x=>x.sets>0).sort((a,b)=> b.wr-a.wr || b.w-a.w);
  if(!ranked.length) return toast("ยังไม่มีสถิติ", true);
  const medal = ["🥇","🥈","🥉"];
  const lines = ranked.slice(0,15).map((x,i)=>
    (medal[i]||("  "+(i+1)+".")) + " " + x.name + " " + Math.round(x.wr*100) + "% (" + x.w + "W-" + x.l + "L)"
  ).join("\n");
  const txt = LANG==="en"
    ? "🏆 Smash Badminton Club — stats & ranking\n\n"
      + lines + (ranked.length>15? "\n…and " + (ranked.length-15) + " more" : "") + "\n\n"
      + "See full per-player stats in the app 👇\n" + APP_URL
    : "🏆 สถิติ & อันดับก๊วน Smash Badminton Club\n\n"
      + lines + (ranked.length>15? "\n…และอีก " + (ranked.length-15) + " คน" : "") + "\n\n"
      + "ดูสถิติเต็มๆ รายคน ได้ในแอป 👇\n" + APP_URL;
  copyLine(txt);
}
function copySessionSummary(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const st = sessionStats(s);
  const mvps = sessionMVP(s);
  const lines = s.attendees.map(a=>{
    const m = mem(a.memberId); if(!m) return null;
    const v = st[a.memberId]||{w:0,l:0,sets:0};
    const wr = v.sets>0? Math.round(v.w/v.sets*100)+"%" : "-";
    return { n: m.name, mvp: mvps.includes(m.id), w:v.w, l:v.l, wr };
  }).filter(Boolean).sort((a,b)=> b.w-a.w || a.l-b.l)
    .map(x=> "• " + x.n + (x.mvp?" ⭐":"") + " " + x.w + "W-" + x.l + "L (" + x.wr + ")").join("\n");
  const txt = LANG==="en"
    ? "🏁 Session result " + fmtDate(s.date) + " — Smash club 🏸\n"
      + "📍 " + (s.loc||"-") + " • " + s.attendees.length + " players • " + (s.sets||[]).length + " sets • " + (s.shuttlesUsed||0) + " shuttles\n"
      + (mvps.length? "⭐ MVP: " + mvps.map(nameOf).join(", ") + "\n" : "")
      + "\n" + lines + "\n\n"
      + "💰 Total cost " + money(totalCost(s)) + " — view / pay in the app 👇\n" + APP_URL
    : "🏁 สรุปผลนัดตี " + fmtDate(s.date) + " — ก๊วน Smash 🏸\n"
      + "📍 " + (s.loc||"-") + " • ผู้เล่น " + s.attendees.length + " คน • " + (s.sets||[]).length + " เซ็ต • ใช้ลูก " + (s.shuttlesUsed||0) + " ลูก\n"
      + (mvps.length? "⭐ MVP: " + mvps.map(nameOf).join(", ") + "\n" : "")
      + "\n" + lines + "\n\n"
      + "💰 ค่าใช้จ่ายรวม " + money(totalCost(s)) + " — ดูยอด / จ่ายเงิน ได้ในแอป 👇\n" + APP_URL;
  copyLine(txt);
}

    <button class="btn btn-lime btn-block" onclick="addMember()">เพิ่มเข้าก๊วน</button>`);

function pickAmEmoji(e){
  window.__selEmoji = e;
  document.querySelectorAll("#amEmoji .emoji-opt").forEach(el=> el.classList.toggle("sel", el.textContent===e));
}
async function addMember(){
  const name = $("amName").value.trim();
  if(!name) return toast("กรอกชื่อก่อนนะ", true);
  if(db.members.some(m=>m.name.toLowerCase()===name.toLowerCase())) return toast("มีชื่อนี้ในก๊วนแล้ว", true);
  db.members.push({ id:uid(), name, emoji:window.__selEmoji||"🏸", pin:null, role:"member", baseW:0, baseL:0, addedBy:meId });
  await storeSave(); closeModal(); renderAll();
  toast("เพิ่ม "+name+" เข้าก๊วนแล้ว 🎉");
}
async function removeMember(id){
  if(!canDeleteMember(id)) return toast("ไม่มีสิทธิ์ลบสมาชิกคนนี้ (เฉพาะตัวเอง, Admin หรือผู้จัดการ)", true);
  const m = mem(id); if(!m) return;
  if(m.role==="admin" && !isAdmin()) return toast("ลบ Admin ไม่ได้", true);
  if(!confirm((id===meId?"ยกเลิกการเป็นสมาชิกของคุณเอง":"ลบ "+m.name+" ออกจากก๊วน")+"?\n(ประวัติในนัดเก่ายังเก็บไว้ แต่จะไม่อยู่ในรายชื่อและนัดที่ยังไม่จบ)")) return;
  db.members = db.members.filter(x=>x.id!==id);
  db.sessions.forEach(s=>{
    if(s.status!=="done"){
      s.attendees = s.attendees.filter(a=>a.memberId!==id);
      if(s.paid) delete s.paid[id];
    }
  });
  if(db.settings.defaultManagerId===id){
    const admin = db.members.find(x=>x.role==="admin");
    db.settings.defaultManagerId = admin? admin.id : (db.members[0]&&db.members[0].id);
  }
  await storeSave();
  if(id===meId){ toast("ยกเลิกสมาชิกแล้ว ขอบคุณที่ร่วมก๊วนกันมา 🙏"); logout(); }
  else { renderAll(); toast("ลบ "+m.name+" ออกจากก๊วนแล้ว"); }
}
async function resetPin(id){
  if(!isAdmin()) return;
  const m = mem(id); if(!m) return;
  if(!confirm("รีเซ็ต PIN ของ "+m.name+"? เขาจะตั้ง PIN ใหม่ตอนล็อกอินครั้งถัดไป")) return;
  m.pin = null; await storeSave(); toast("รีเซ็ต PIN ของ "+m.name+" แล้ว");
}

/* สถิติคู่หู: จับคู่ตีด้วยกันแล้วชนะ-แพ้กี่เซ็ต (Best Partner) */
function pairStats(){
  const p = {};
  db.sessions.filter(s=>s.status==="done").forEach(s=>(s.sets||[]).forEach(x=>{
    const w = setWinner(x); if(!w) return;
    [["A",x.teamA],["B",x.teamB]].forEach(([side,team])=>{
      if(!team || team.length<2) return;
      const ids = [...team].sort();
      const key = ids.join("|");
      if(!p[key]) p[key] = { ids, w:0, l:0 };
      (w===side)? p[key].w++ : p[key].l++;
    });
  }));
  return Object.values(p).map(x=>({...x, sets:x.w+x.l, wr:(x.w+x.l)>0? x.w/(x.w+x.l):0}));
}
/* =====================================================
   PRO MODE: ค่ามือ (Elo) + ระดับมือ S/N/P
   - คำนวณจากประวัติเซ็ตทั้งหมด (นัดจบแล้ว + นัดกำลังตี) เรียงตามเวลา
   - แต้มเริ่มต้นอ้างอิงสถิติเดิม: ใครมียอดยกมา (baseW/baseL) ≥10 เซ็ต
     จะเริ่มสูง/ต่ำกว่า 1000 ตาม Win% เดิม (จำกัด ±120)
   - คำนวณให้ทุกคน (เพื่อความแม่นของคู่ตี) แต่แสดงเฉพาะสมาชิก Pro
   ===================================================== */
const ELO_START = 1000, ELO_K = 32;
const LV_N = 1075, LV_P = 1175, LV_MIN_SETS = 8;   // เกณฑ์ระดับมือ: S < 1075 ≤ N < 1175 ≤ P
function eloSeed(m){
  const t = (m.baseW||0)+(m.baseL||0);
  if(t>=10){ const d = ((m.baseW||0)/t - 0.5)*400; return ELO_START + Math.max(-120, Math.min(120, d)); }
  return ELO_START;
}
function eloAll(){
  const R = {}, hist = {};
  db.members.forEach(m=>{ R[m.id]=eloSeed(m); hist[m.id]=[]; });
  const ses = [...db.sessions].filter(s=>s.status==="done"||s.status==="playing")
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)));   // sort เสถียร: วันเดียวกันคงลำดับเดิม
  ses.forEach(s=> (s.sets||[]).forEach(x=>{
    const w = setWinner(x); if(!w) return;
    const A = (x.teamA||[]).filter(id=>R[id]!=null), B = (x.teamB||[]).filter(id=>R[id]!=null);
    if(!A.length || !B.length) return;
    const ra = A.reduce((t,id)=>t+R[id],0)/A.length;
    const rb = B.reduce((t,id)=>t+R[id],0)/B.length;
    const ea = 1/(1+Math.pow(10,(rb-ra)/400));      // โอกาสชนะที่คาดของทีม A
    const sa = w==="A"? 1 : 0;
    const dA = ELO_K*(sa-ea), dB = ELO_K*((1-sa)-(1-ea));
    A.forEach(id=>{ R[id]+=dA; hist[id].push({won:sa===1, d:dA}); });
    B.forEach(id=>{ R[id]+=dB; hist[id].push({won:sa===0, d:dB}); });
  }));
  const out = {};
  Object.keys(R).forEach(id=> out[id] = { r:Math.round(R[id]), sets:hist[id].length, last:hist[id].slice(-10) });
  return out;
}
function handLevel(e){
  if(!e || e.sets<LV_MIN_SETS) return { lv:"รอประเมิน", color:"var(--ink-soft)", next:null, need:e? LV_MIN_SETS-e.sets : LV_MIN_SETS };
  if(e.r>=LV_P) return { lv:"P", color:"var(--lime)", next:null };
  if(e.r>=LV_N) return { lv:"N", color:"var(--blue)", next:LV_P-e.r };
  return { lv:"S", color:"var(--amber)", next:LV_N-e.r };
}

function careerStats(){
  return db.members.map(m=>{
    let w = m.baseW||0, l = m.baseL||0, played = 0;
    db.sessions.filter(s=>s.status==="done").forEach(s=>{
      if(s.attendees.some(a=>a.memberId===m.id)) played++;
      const st = sessionStats(s)[m.id];
      if(st){ w+=st.w; l+=st.l; }
    });
    const sets = w+l;
    return { id:m.id, name:m.name, emoji:m.emoji, w, l, sets, played, wr: sets>0? w/sets : null };
  });
}

function regularMonths(){
  const set = {};
  db.sessions.filter(s=> s.status==="done"||s.status==="playing").forEach(s=>{
    const m = String(s.date||"").slice(0,7); if(m.length===7) set[m]=true;
  });
  return Object.keys(set).sort().reverse();   // เดือนล่าสุดก่อน
}
function regularStats(month){
  const ses = db.sessions.filter(s=> (s.status==="done"||s.status==="playing") && String(s.date||"").slice(0,7)===month);
  const cnt = {};
  ses.forEach(s=> (s.attendees||[]).forEach(a=>{ cnt[a.memberId]=(cnt[a.memberId]||0)+1; }));
  const rows = Object.keys(cnt)
    .map(id=>({ m:mem(id), n:cnt[id] }))
    .filter(x=> x.m && x.m.role!=="admin")          // ยกเว้น Admin ตามกติการางวัล
    .sort((a,b)=> b.n-a.n || a.m.name.localeCompare(b.m.name, "th"));
  return { rows, total: ses.length };
}

  const ms = regularMonths(); if(!ms.length) return;

/* ---------- สถิติรายคน: ตีกับใคร แพ้ชนะกี่แต้ม ---------- */
function openPlayerStats(id){
  const m = mem(id); if(!m) return;
  const c = careerStats().find(x=>x.id===id) || {w:0,l:0,sets:0,wr:null};
  const opp = {}, par = {}, items = [];
  db.sessions.filter(s=>s.status==="done").sort((a,b)=> b.date.localeCompare(a.date)).forEach(s=>{
    (s.sets||[]).forEach(x=>{
      const inA = x.teamA.includes(id), inB = x.teamB.includes(id);
      if(!inA && !inB) return;
      const w = setWinner(x);
      const won = (w==="A"&&inA) || (w==="B"&&inB);
      const myTeam = inA? x.teamA : x.teamB;
      const others = inA? x.teamB : x.teamA;
      const myS = inA? x.scoreA : x.scoreB, otS = inA? x.scoreB : x.scoreA;
      others.forEach(o=>{ if(!opp[o]) opp[o]={w:0,l:0}; won? opp[o].w++ : opp[o].l++; });
      myTeam.filter(p=>p!==id).forEach(p=>{ if(!par[p]) par[p]={w:0,l:0}; won? par[p].w++ : par[p].l++; });
      items.push({date:s.date, court:x.court, myTeam, others, myS, otS, won});
    });
  });
  const oppRows = Object.keys(opp).sort((a,b)=> opp[b].w-opp[a].w || (opp[b].w+opp[b].l)-(opp[a].w+opp[a].l)).map(o=>
    `<tr><td>${emojiOf(o)} ${esc(nameOf(o))}</td>
      <td style="text-align:center; color:var(--lime); font-weight:700;">${opp[o].w}</td>
      <td style="text-align:center; color:var(--coral);">${opp[o].l}</td></tr>`).join("");
  const parRows = Object.keys(par).sort((a,b)=> par[b].w-par[a].w || (par[b].w+par[b].l)-(par[a].w+par[a].l)).map(o=>
    `<tr><td>${emojiOf(o)} ${esc(nameOf(o))}</td>
      <td style="text-align:center; color:var(--lime); font-weight:700;">${par[o].w}</td>
      <td style="text-align:center; color:var(--coral);">${par[o].l}</td></tr>`).join("");
  const setRows = items.map(it=>`
    <div class="set-card">
      <div class="set-teams">
        <div class="set-team ${it.won?"w":""}">${teamLabel(it.myTeam)}</div>
        <div class="set-score">${it.myS} : ${it.otS}</div>
        <div class="set-team ${it.won?"":"w"}">${teamLabel(it.others)}</div>
      </div>
      <div class="set-meta">${fmtDateShort(it.date)} • คอร์ท ${esc(it.court)} • ${it.won? '<span style="color:var(--lime); font-weight:700;">ชนะ</span>' : '<span style="color:var(--coral); font-weight:700;">แพ้</span>'} ${Math.abs(it.myS-it.otS)} แต้ม</div>
    </div>`).join("");
  modal(`
    <div class="modal-head"><h3>${m.emoji} สถิติของ ${esc(m.name)}</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="statgrid" style="margin:0 0 12px;">
      <div class="statbox"><div class="v" style="color:var(--lime);">${c.w}</div><div class="l">ชนะ (เซ็ต)</div></div>
      <div class="statbox"><div class="v" style="color:var(--coral);">${c.l}</div><div class="l">แพ้ (เซ็ต)</div></div>
      <div class="statbox"><div class="v">${c.sets>0? Math.round(c.wr*100)+"%":"-"}</div><div class="l">อัตราชนะ</div></div>
    </div>
    ${(m.baseW||m.baseL)? `<p class="muted" style="margin:0 0 10px;">* รวมยอดยกมาจากไฟล์เดิม ${m.baseW||0}W-${m.baseL||0}L (ไม่มีรายละเอียดรายเซ็ต)</p>`:""}
    ${parRows? `<div class="card" style="margin-bottom:12px;"><h3>🤝 Best Partner — สถิติกับคู่หู <span class="muted" style="font-weight:400; font-size:11px;">(เรียงจากชนะมากสุด)</span></h3>
      <table class="tbl"><tr><th>จับคู่กับ</th><th style="text-align:center;">ชนะ</th><th style="text-align:center;">แพ้</th></tr>${parRows}</table></div>`:""}
    ${oppRows? `<div class="card" style="margin-bottom:12px;"><h3>⚔️ สถิติกับคู่ต่อสู้ <span class="muted" style="font-weight:400; font-size:11px;">(เรียงจากชนะมากสุด)</span></h3>
      <table class="tbl"><tr><th>เจอกับ</th><th style="text-align:center;">ชนะ</th><th style="text-align:center;">แพ้</th></tr>${oppRows}</table></div>`:""}
    <div class="card" style="margin-bottom:0;"><h3>📜 เซ็ตย้อนหลัง (${items.length})</h3>
      ${setRows || '<div class="empty"><div class="big">🏸</div>ยังไม่มีเซ็ตที่บันทึกไว้</div>'}</div>

function renderPro(){

  const E = eloAll();
  const my = E[meId] || {r:ELO_START, sets:0, last:[]};
  const lv = handLevel(my);
  const last = my.last;
  const w10 = last.filter(x=>x.won).length;
  const trend = last.slice(-5).reduce((t,x)=>t+x.d,0);
  const trendIcon = last.length<3? "" : trend>4? "📈 กำลังมาแรง" : trend<-4? "📉 ฟอร์มตก" : "➡️ ทรงตัว";
  // แต้มต่างรวม (ได้−เสีย) ของเซ็ตล่าสุดไม่เกิน 10 เซ็ต — นำแต้มมาคิดคู่กับผลแพ้ชนะ
  let myDiff = 0, myDiffN = 0;
  [...db.sessions].filter(s=>s.status==="done"||s.status==="playing")
    .sort((a,b)=> String(b.date).localeCompare(String(a.date)))
    .forEach(s=> [...(s.sets||[])].reverse().forEach(x=>{
      if(myDiffN>=10) return;
      const inA = (x.teamA||[]).includes(meId), inB = (x.teamB||[]).includes(meId);
      if(!inA && !inB) return;
      const mS = inA? Number(x.scoreA)||0 : Number(x.scoreB)||0;
      const oS = inA? Number(x.scoreB)||0 : Number(x.scoreA)||0;
      myDiff += mS-oS; myDiffN++;

  // อันดับสมาชิก Pro (แสดงเฉพาะคน Pro — คนอื่นคำนวณเบื้องหลังเพื่อความแม่น แต่ไม่แสดง)

  // คิวแฟร์: นัดกำลังตี — ใครตีน้อยสุดควรได้ลงก่อน
  let queueCard = "";
  if(act && act.status==="playing"){

    queueCard = `<div class="card">
      <h3>⏳ คิวแฟร์ — นัดวันนี้ <span class="muted" style="font-weight:400; font-size:11px;">(ตีน้อยสุดควรได้ลงคิวก่อน)</span></h3>
      ${q.map((x,i)=>`<div class="court-line"><span style="width:20px; text-align:center;">${i+1}.</span><span style="flex:1;">${x.m.emoji} ${esc(x.m.name)}</span><b>${x.n} เซ็ต</b>${i===0? ' <span class="tag tag-open" style="font-size:10px;">ลงก่อนเลย!</span>':""}</div>`).join("")}
    </div>`;
  }

  v.innerHTML = `

    <div class="sess-hero">
      <div class="row"><span class="tag tag-mgr">⚡ โหมด Pro</span><button class="btn btn-ghost btn-sm" onclick="quitPro()">ออกจากโหมด Pro</button></div>
      <div class="sess-date">${m.emoji} ${esc(m.name)}</div>
      <div class="statgrid" style="margin-top:10px;">
        <div class="statbox"><div class="v" style="color:${lv.color}; font-size:26px;">${lv.lv}</div><div class="l">ระดับมือ</div></div>
        <div class="statbox"><div class="v" style="color:var(--lime);">${my.r}</div><div class="l">ค่ามือ</div></div>
        <div class="statbox"><div class="v">${last.length? w10+"-"+(last.length-w10):"-"}</div><div class="l">ฟอร์ม ${last.length} เซ็ตล่าสุด</div></div>
      </div>
      <div class="muted" style="margin-top:10px; font-size:12.5px;">
        ${lv.lv==="รอประเมิน"? `ตีอีก <b style="color:var(--lime);">${lv.need}</b> เซ็ตจะเริ่มจัดระดับมือ (ต้องมีอย่างน้อย ${LV_MIN_SETS} เซ็ต)`
          : lv.next? `อีก <b style="color:var(--lime);">${lv.next}</b> แต้ม เลื่อนขั้นเป็นมือ ${lv.lv==="S"?"N":"P"}` : `🏅 ถึงระดับสูงสุดแล้ว — รักษาไว้ให้ได้!`}
        ${trendIcon? " • "+trendIcon:""}
        ${myDiffN? ` • แต้มต่าง ${myDiffN} เซ็ตล่าสุด <b style="color:${myDiff>0?"var(--lime)":myDiff<0?"var(--coral)":"var(--ink-soft)"};">${myDiff>0?"+":""}${myDiff}</b>`:""}

        ${proRows}

      <p class="muted" style="margin:8px 0 0; font-size:11px;">ชนะทีมค่ามือสูงกว่า = ได้แต้มเยอะ • ชนะทีมค่ามือต่ำกว่า = ได้แต้มน้อย — การเลือกคู่ตีจึงมีผลต่อคะแนน</p>

      • เซ็ตคู่ใช้ค่าเฉลี่ยของทีม แล้วแบ่งแต้มให้ทั้งคู่เท่ากัน<br>

      • ค่ามือคำนวณจากเซ็ตที่บันทึกในแอปเท่านั้น และแสดงเฉพาะสมาชิก Pro ด้วยกัน</p>

function proPickToggle(id){
  window.__proPick = window.__proPick||[];
  const i = window.__proPick.indexOf(id);
  if(i>=0) window.__proPick.splice(i,1);
  else {
    if(window.__proPick.length>=4) return toast("เลือกได้ 4 คน — เอาคนเดิมออกก่อน", true);
    window.__proPick.push(id);
  }
  renderPro(); translateDom($("v-pro"));
}
function suggestTeams(){
  const pick = window.__proPick||[];
  if(pick.length!==4) return toast("เลือกให้ครบ 4 คนก่อนนะ (ตอนนี้ "+pick.length+")", true);
  const E = eloAll();
  const r = id => (E[id]||{r:ELO_START}).r;
  const [a,b,c,d] = pick;
  const opts = [ [[a,b],[c,d]], [[a,c],[b,d]], [[a,d],[b,c]] ];
  let best=null, bestGap=1e9;
  opts.forEach(([t1,t2])=>{
    const g = Math.abs((r(t1[0])+r(t1[1]))/2 - (r(t2[0])+r(t2[1]))/2);
    if(g<bestGap){ bestGap=g; best=[t1,t2]; }
  });
  const ra=(r(best[0][0])+r(best[0][1]))/2, rb=(r(best[1][0])+r(best[1][1]))/2;
  const pa = Math.round(100/(1+Math.pow(10,(rb-ra)/400)));
  const el = $("proSuggest");
  if(el) el.innerHTML = `<div class="court-reco" style="display:block;">
    <div style="text-align:center; font-weight:800; font-family:'Prompt',sans-serif;">${teamLabel(best[0])}<br><span style="color:var(--lime);">VS</span><br>${teamLabel(best[1])}</div>
    <div class="muted" style="text-align:center; margin-top:6px; font-size:12px;">โอกาสชนะ ${pa}% : ${100-pa}% — ${bestGap<15?"สูสีมาก! 🔥": bestGap<40?"สูสีกำลังดี":"ต่างกันพอสมควร แต่นี่คือแบบที่สูสีที่สุดแล้ว"}</div>
  </div>`;
  translateDom($("v-pro"));
}

/* ลบนัดที่จบแล้วออกจากประวัติ (Admin/ผู้จัดการ) — ยืนยัน 2 ชั้นเพราะสถิติและค่าใช้จ่ายของนัดจะหายทั้งหมด */
async function delDoneSession(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  if(!confirm("ลบนัดวันที่ "+fmtDateShort(s.date)+" ออกจากประวัติ?\nสถิติและค่าใช้จ่ายของนัดนี้จะหายทั้งหมด")) return;
  if(!confirm("ยืนยันอีกครั้ง — ลบนัดนี้ถาวร กู้คืนไม่ได้")) return;
  db.sessions = db.sessions.filter(x=>x.id!==sid);
  await storeSave(); renderAll();
  toast("ลบนัดออกจากประวัติแล้ว 🗑️");
}

/* =====================================================
   AUTO REFRESH (ดึงข้อมูลที่เพื่อนแก้มาอัปเดต)
   ===================================================== */
/* ---------- polling ปรับตามบริบท ----------
   • นัดสถานะ "กำลังตี" → ทุก 5 วิ (ช่วงที่หลายคนบันทึกเซ็ตพร้อมกัน ต้องสด)
   • ปกติ → ทุก 15 วิ
   • แอปถูกพับ/สลับแท็บ → หยุดดึงข้อมูล (ประหยัดแบตและโควตา) แล้วดึงทันทีเมื่อเปิดกลับมา */
let __pollTimer = null;
function schedulePoll(){
  clearTimeout(__pollTimer);
  if(document.hidden) return;
  const playing = db && db.sessions && db.sessions.some(x=>x.status==="playing");
  __pollTimer = setTimeout(async ()=>{ await pollRemote(); schedulePoll(); }, playing? 5000 : 15000);
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ clearTimeout(__pollTimer); }
  else { pollRemote(); schedulePoll(); }
});
async function pollRemote(){
  if(modalOpen()) return;
  if(gasUrl() && !clubKey()) return;   // ยังไม่ผ่านรหัสก๊วน — ไม่ดึงข้อมูล
  try{
    if(gasUrl()){
      const remote = await gasLoad();
      if(remote && (remote.rev||0) > (db.rev||0)){
        db = remote;
        if(meId && !mem(meId)){ toast("บัญชีของคุณถูกนำออกจากก๊วน", true); logout(); return; }
        if(meId) renderAll(); else renderLogin();
      }
      updateSyncBadge();
      return;
    }
    if(!storageOK) return;
    const r = await window.storage.get(KEY, true);
    if(r && r.value && r.value!==lastRaw){
      const incoming = JSON.parse(r.value);
      if((incoming.rev||0) >= (db.rev||0)){
        lastRaw = r.value; db = incoming;
        if(meId && !mem(meId)){ toast("บัญชีของคุณถูกนำออกจากก๊วน", true); logout(); return; }
        if(meId) renderAll(); else renderLogin();
      }
    }
  }catch(e){}
}

/* =====================================================
   INIT
   ===================================================== */
async function init(){
  // แสดงหน้าจอทันทีด้วยข้อมูลชั่วคราว แล้วซิงก์ของจริงเบื้องหลัง — แอปเปิดไว ไม่ค้างหน้าขาว
  db = seedDb();
  window.__booting = true;
  // 🔒 ยังไม่มีรหัสเข้าก๊วนบนเครื่องนี้ — แสดงหน้าใส่รหัสทันที (ไม่โหลด/ไม่แสดงข้อมูลใดๆ)
  if(gasUrl() && !clubKey()){
    window.__booting = false;
    renderLogin();
    return;
  }
  renderLogin();
  // 1) Google Sheet (ถ้ารู้ URL จากไฟล์/ลิงก์) → 2) Claude storage → 3) เริ่มใหม่
  let loaded = null;
  if(gasUrl()) loaded = await gasLoad();
  if(!loaded){
    const cs = await claudeLoad();
    if(cs){
      loaded = cs;
      // ถ้าเคยตั้ง Google Sheet Sync ไว้ (เก็บใน settings) — สลับไปใช้ชีตเป็นหลัก
      if(!window.__gasOverride && !GAS_URL && cs.settings && cs.settings.gasUrl){
        window.__gasOverride = cs.settings.gasUrl;
        const g = await gasLoad();
        if(g && (g.rev||0) >= (cs.rev||0)) loaded = g;
      }
    }
  }
  window.__booting = false;
  db = loaded || seedDb();
  if(!loaded) await storeSave();
  // one-time: ซิงก์รายชื่อสมาชิกชุดใหม่จากที่ Nu ปรับไว้ (ทำครั้งเดียวต่อฐานข้อมูล)
  if((db.nameSyncV||0) < NAME_SYNC_V){
    db.members.forEach(m=>{ if(NAME_SYNC[m.id]) m.name = NAME_SYNC[m.id]; });
    NAME_SYNC_ADD.forEach(x=>{
      if(!db.members.some(m=>m.id===x.id || m.name.toLowerCase()===x.name.toLowerCase()))
        db.members.push({ id:x.id, name:x.name, emoji:x.emoji, pin:null, role:"member", baseW:0, baseL:0 });
    });
    db.nameSyncV = NAME_SYNC_V;
    await storeSave();
  }
  // ensure admin + default manager always valid
  const nu = db.members.find(m=>m.name===ADMIN_NAME);
  if(nu && nu.role!=="admin"){ nu.role="admin"; }
  if(!db.settings) db.settings = {};
  if(!db.settings.defaultManagerId || !mem(db.settings.defaultManagerId)){
    db.settings.defaultManagerId = nu? nu.id : (db.members[0]&&db.members[0].id);
  }
  // one-time: เพิ่มนัดตัวอย่างย้อนหลัง 4 ครั้ง (ลบทิ้งได้ ไม่กลับมาอีก)
  if((db.mockV||0) < 2){
    DEMO_SESSIONS.forEach(ds=>{
      if(!db.sessions.some(s=>s.id===ds.id)) db.sessions.push(JSON.parse(JSON.stringify(ds)));
    });
    db.mockV = 2;
    await storeSave();
  }
  // one-time: เพิ่มตัวอย่าง "แจ้งจ่ายเงินสด รออนุมัติ" ในนัดตัวอย่าง 6 ส.ค. (ให้ทดสอบปุ่มอนุมัติ)
  if((db.mockV||0) < 3){
    const ds = db.sessions.find(s=>s.id==="demo20260806");
    if(ds && !(ds.paid && ds.paid.m5) && !(ds.payReq && ds.payReq.m5)){
      if(!ds.payReq) ds.payReq = {};
      ds.payReq.m5 = { method:"cash", at:1786452000000 };
    }
    db.mockV = 3;
    await storeSave();
  }
  // one-time: ตั้ง Noi เป็นผู้จัดการ (ค่าเริ่มต้น) ตามที่ก๊วนกำหนด
  if((db.flowV||0) < 1){
    const noi = db.members.find(m=>m.id==="m7") || db.members.find(m=>m.name==="Noi");
    if(noi) db.settings.defaultManagerId = noi.id;
    db.flowV = 1;
    await storeSave();
  }
  // one-time (2026-08-13): เปลี่ยนผู้จัดการค่าเริ่มต้นเป็น Nu ตามที่ก๊วนกำหนดใหม่ — ยังเปลี่ยนภายหลังได้จากหน้าสมาชิก
  if((db.flowV||0) < 2){
    const nu = db.members.find(m=>m.id==="m10") || db.members.find(m=>m.name==="Nu");
    if(nu) db.settings.defaultManagerId = nu.id;
    db.flowV = 2;
    await storeSave();
  }
  // one-time: เปิดกระดานสื่อสารก๊วน พร้อมประกาศต้อนรับจากผู้จัดการ
  if(!db.board) db.board = [];
  if((db.boardV||0) < 1){
    if(!db.board.length){
      const mgrId = db.settings.defaultManagerId || (db.members.find(m=>m.role==="admin")||{}).id;
      if(mgrId) db.board.push({ id:"bd-welcome", from:mgrId, text:"ยินดีต้อนรับสู่กระดานสื่อสารของก๊วน 🏸 Admin/ผู้จัดการประกาศได้ที่นี่ สมาชิกกดเข้ามาอ่านและตอบโต้กันได้เลย", at:Date.now() });
    }
    db.boardV = 1;
    await storeSave();
  }
  updateSyncBadge();
  // จำการล็อกอินไว้ในเครื่อง — เข้าแอปใหม่ไม่ต้องใส่ PIN จนกว่าจะกด Log-out
  const savedId = lsGet(LOGIN_KEY);
  if(!meId && savedId && mem(savedId)){
    meId = savedId;
    $("loginView").style.display="none";
    $("appView").style.display="block";
    renderAll();
    toast("สวัสดี "+nameOf(meId)+" "+emojiOf(meId)+" 🏸");
  } else if(savedId && !mem(savedId)){
    lsDel(LOGIN_KEY);
  }
  if(meId) renderAll(); else renderLogin();
  schedulePoll();
}
init();
/* PWA: service worker แบบเบาที่สุด เพื่อให้ติดตั้งเป็นแอปได้ (ไม่แคช — ได้เวอร์ชันใหม่เสมอ) */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
