<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smash Badminton">
<title>Smash Badminton Club</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0B1020;
  --bg2:#0F1730;
  --card:#161F38;
  --card2:#1D2846;
  --line:#27335A;
  --ink:#EDF1FF;
  --ink-soft:#93A0C4;
  --lime:#C6F24E;
  --lime-dark:#9CCB2E;
  --blue:#5B8CFF;
  --coral:#FF6B5E;
  --amber:#FFC24B;
  --green:#3ED598;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width:0;}
html,body{margin:0; padding:0; overflow-x:hidden; max-width:100vw;}
body{ background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.disp{ font-family:'Prompt',sans-serif; }
button{ font-family:'Noto Sans Thai',sans-serif; cursor:pointer; }
input,select{ font-family:'Noto Sans Thai',sans-serif; }

/* ---------- shared ---------- */
.wrap{ max-width:720px; margin:0 auto; padding:0 16px 90px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.card h3{ margin:0 0 12px; font-size:18px; font-weight:800; color:var(--lime); letter-spacing:.01em; display:flex; align-items:center; gap:8px; border-left:4px solid var(--lime); padding-left:10px; }
.muted{ color:var(--ink-soft); font-size:13.5px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.btn{ border:none; border-radius:12px; padding:13px 20px; font-weight:700; font-size:15.5px; }
.btn:active{ transform:scale(.97); }
.btn:disabled{ opacity:.45; }
.btn-lime{ background:var(--lime); color:#15230A; }
.btn-blue{ background:var(--blue); color:#fff; }
.btn-ghost{ background:var(--card2); color:var(--ink); border:1px solid var(--line); }
.btn-danger{ background:rgba(255,107,94,.15); color:var(--coral); border:1px solid rgba(255,107,94,.35); }
.btn-sm{ padding:10px 14px; font-size:14px; border-radius:10px; }
.btn-block{ width:100%; }
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%; background:var(--bg2); color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15.5px;
}
textarea{ font-family:'Noto Sans Thai',sans-serif; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--blue); }
label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
.field{ margin-bottom:12px; }
.frow{ display:flex; gap:10px; } .frow .field{ flex:1; }
.tag{ display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:999px; }
.tag-admin{ background:rgba(255,194,75,.15); color:var(--amber); border:1px solid rgba(255,194,75,.4); }
.tag-mgr{ background:rgba(91,140,255,.15); color:var(--blue); border:1px solid rgba(91,140,255,.4); }
.tag-open{ background:rgba(198,242,78,.13); color:var(--lime); border:1px solid rgba(198,242,78,.35); }
.tag-play{ background:rgba(255,194,75,.13); color:var(--amber); border:1px solid rgba(255,194,75,.35); }
.tag-done{ background:rgba(147,160,196,.13); color:var(--ink-soft); border:1px solid var(--line); }
.tag-paid{ background:rgba(62,213,152,.13); color:var(--green); border:1px solid rgba(62,213,152,.4); cursor:pointer; }
.tag-unpaid{ background:rgba(255,107,94,.13); color:var(--coral); border:1px solid rgba(255,107,94,.4); cursor:pointer; }
.tag-pending{ background:rgba(255,194,75,.13); color:var(--amber); border:1px solid rgba(255,194,75,.45); }
.slip-img{ width:100%; max-height:52vh; object-fit:contain; border-radius:12px; border:1px solid var(--line); background:var(--bg2); }
.banner-due{ background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.45); color:var(--coral); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; cursor:pointer; }
.banner-approve{ background:rgba(62,213,152,.1); border:1px solid rgba(62,213,152,.5); color:var(--green); border-radius:12px; padding:10px 13px; font-size:12.5px; margin-bottom:12px; cursor:pointer; }
.banner-due.nudged{ animation:pulseDue 1.6s ease-in-out infinite; }
@keyframes pulseDue{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,94,0); } 50%{ box-shadow:0 0 0 4px rgba(255,107,94,.22); } }
/* กระดานสื่อสารก๊วน */
.board-row{ display:flex; gap:8px; align-items:stretch; margin-bottom:12px; }
.banner-board{ flex:1; background:rgba(91,157,255,.12); border:1px solid rgba(91,157,255,.55); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:16px; line-height:1.45; font-weight:600; cursor:pointer; min-width:0; }
.banner-board .bmsg{ color:var(--amber); font-weight:800; text-shadow:0 0 10px rgba(255,194,75,.35); }
.banner-board.blink{ animation:pulseBoard 1.5s ease-in-out infinite; }
@keyframes pulseBoard{ 0%,100%{ box-shadow:0 0 0 0 rgba(91,157,255,0); border-color:rgba(91,157,255,.55); } 50%{ box-shadow:0 0 0 5px rgba(91,157,255,.28); border-color:rgba(91,157,255,.95); } }
.board-write{ border:none; border-radius:12px; padding:0 13px; background:var(--lime); color:#10250b; font-weight:800; font-family:'Prompt',sans-serif; font-size:12.5px; cursor:pointer; white-space:nowrap; }
.brd-msg{ border:1px solid var(--line); background:var(--card2); border-radius:11px; padding:8px 11px; margin-bottom:7px; font-size:14px; }
.brd-msg.ann > .notx{ color:var(--amber); font-weight:700; }
.brd-msg.own{ border-color:rgba(198,242,78,.45); }
.brd-msg.ann{ border-color:rgba(91,157,255,.6); background:rgba(91,157,255,.08); }
.brd-head{ display:flex; gap:6px; align-items:center; font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }
.brd-head b{ color:var(--ink); }
/* รายชื่อผู้ลงชื่อ (หน้าแรก) */
.att-list{ margin-top:12px; }
.att-row{ display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.03); margin-bottom:6px; font-size:13.5px; }
.att-row.me{ border-color:rgba(198,242,78,.55); cursor:pointer; }
.att-row .no{ min-width:18px; text-align:right; color:var(--ink-soft); font-size:11px; }
.att-row .nm{ font-weight:700; white-space:nowrap; }
.att-row .nt{ flex:1; text-align:right; font-size:12px; color:var(--amber); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* label เด่นในฟอร์มบันทึกเซ็ต */
.setlbl{ font-size:15.5px !important; font-weight:800 !important; color:var(--lime) !important; font-family:'Prompt','Noto Sans Thai',sans-serif; }
.setlbl.ta{ color:var(--blue) !important; }
.setlbl.tb{ color:var(--coral) !important; }
.setlbl.sh{ color:var(--amber) !important; font-size:14.5px !important; }
/* ตัวบอกว่าแอปกำลังทำงาน (ซิงก์เบื้องหลัง) */
.spin{ display:inline-block; animation:spinCw 1.4s linear infinite; }
@keyframes spinCw{ to{ transform:rotate(360deg); } }
.boot-sync{ display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(91,140,255,.12); border:1px solid rgba(91,140,255,.4); color:var(--blue); border-radius:12px; padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:12px; }
.boot-dots::after{ content:""; animation:dots 1.5s steps(4,end) infinite; }
@keyframes dots{ 0%{content:"";} 25%{content:".";} 50%{content:"..";} 75%{content:"...";} }
.chip{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px 8px 8px; border-radius:999px; background:var(--card2); border:1.5px solid var(--line); font-size:15px; font-weight:600; cursor:pointer; user-select:none; }
.chip .av{ width:28px; height:28px; border-radius:50%; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:15px; }
.chip.on{ border-color:var(--lime); background:rgba(198,242,78,.1); }
.chip.on::after{ content:"✓"; color:var(--lime); font-weight:800; }
.chip.pa{ border-color:var(--blue); background:rgba(91,140,255,.12); }
.chip.pa::after{ content:"A"; color:var(--blue); font-weight:800; }
.chip.pb{ border-color:var(--coral); background:rgba(255,107,94,.12); }
.chip.pb::after{ content:"B"; color:var(--coral); font-weight:800; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.empty{ text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:13.5px; }
.empty .big{ font-size:32px; margin-bottom:6px; }
.divider{ height:1px; background:var(--line); margin:14px 0; }
#toast{ position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(16px); background:var(--lime); color:#15230A; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:999; max-width:90vw; text-align:center; }
#toast.show{ opacity:1; transform:translateX(-50%); }
#toast.err{ background:var(--coral); color:#fff; }

/* ---------- login ---------- */
#loginView{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; background:
  radial-gradient(600px 320px at 80% -10%, rgba(91,140,255,.25), transparent),
  radial-gradient(500px 300px at 0% 100%, rgba(198,242,78,.12), transparent), var(--bg); }
.logo-badge{ width:74px; height:74px; border-radius:22px; background:linear-gradient(140deg, var(--lime), var(--lime-dark)); display:flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:14px; box-shadow:0 10px 30px rgba(198,242,78,.25); }
#loginView h1{ margin:0 0 2px; font-size:26px; font-weight:800; letter-spacing:-.01em; }
#loginView .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
.login-panel{ width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; }
.member-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; max-height:46vh; overflow-y:auto; }
.mg-item{ background:var(--card2); border:1.5px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; }
.mg-item:hover{ border-color:var(--blue); }
.mg-item .em{ font-size:28px; }
.mg-item .nm{ font-size:14.5px; font-weight:700; margin-top:3px; word-break:break-word; }
.mg-item .rl{ font-size:9.5px; color:var(--amber); font-weight:700; }
.pin-dots{ display:flex; gap:12px; justify-content:center; margin:16px 0; }
.pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); }
.pin-dot.fill{ background:var(--lime); border-color:var(--lime); }
.pin-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.pin-key{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 0; font-size:19px; font-weight:700; color:var(--ink); font-family:'Prompt',sans-serif; }
.pin-key:active{ background:var(--bg2); }
.next-banner{ background:linear-gradient(150deg, rgba(198,242,78,.14), rgba(91,140,255,.10)); border:1.5px solid rgba(198,242,78,.45); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
.next-banner .nb-t{ font-family:'Prompt',sans-serif; font-weight:800; font-size:14px; color:var(--lime); display:flex; align-items:center; gap:8px; }
.next-banner .nb-d{ font-family:'Prompt',sans-serif; font-weight:800; font-size:17px; margin:3px 0 1px; }
.next-banner .nb-n{ margin-top:6px; font-size:13.5px; }
.next-banner .nb-n b{ color:var(--lime); font-size:16px; }

/* ---------- app shell ---------- */
#appView{ display:none; }
.topbar{ position:sticky; top:0; z-index:50; background:rgba(11,16,32,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:720px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand .b-ic{ width:42px; height:42px; border-radius:12px; background:linear-gradient(140deg,var(--lime),var(--lime-dark)); display:flex; align-items:center; justify-content:center; font-size:22px; }
.brand .b-t{ font-family:'Prompt',sans-serif; font-weight:800; font-size:20px; line-height:1.1; }
.brand .b-s{ font-size:11.5px; color:var(--ink-soft); }
.mecap{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 6px; cursor:pointer; }
.mecap .av{ width:26px; height:26px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:14px; }
.mecap .nm{ font-size:13px; font-weight:700; max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.exitbtn{ display:flex; align-items:center; gap:5px; padding:8px 13px; border-radius:999px; background:rgba(255,107,94,.14); border:1px solid rgba(255,107,94,.4); font-size:15px; flex-shrink:0; color:var(--coral); font-weight:800; }
.exitbtn span{ font-size:12.5px; font-family:'Prompt',sans-serif; }
.exitbtn:active{ transform:scale(.95); }
.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:50; background:rgba(15,23,48,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); }
.bottomnav-in{ max-width:720px; margin:0 auto; display:flex; }
.bn-item{ flex:1; background:none; border:none; padding:9px 4px 10px; text-align:center; color:var(--ink-soft); font-size:12px; font-weight:700; }
.bn-item .ic{ font-size:25px; display:block; margin-bottom:2px; filter:grayscale(1) opacity(.65); }
.bn-item.on{ color:var(--lime); }
.bn-item.on .ic{ filter:none; }
.view{ display:none; padding-top:16px; }
.view.on{ display:block; animation:fade .22s ease; }
@keyframes fade{ from{opacity:0; transform:translateY(5px);} to{opacity:1;} }

/* ---------- ตัวบอกขั้นตอนนัดตี ---------- */
.stepper{ display:flex; gap:6px; margin:0 0 16px; }
.step{ flex:1; text-align:center; font-size:13px; font-weight:800; color:var(--ink-soft); background:var(--bg2); border:1.5px solid var(--line); border-radius:12px; padding:11px 2px 9px; line-height:1.3; cursor:pointer; user-select:none; }
.step:active{ transform:scale(.96); }
.step .s-n{ display:block; font-family:'Prompt',sans-serif; font-size:13px; font-weight:800; margin-bottom:2px; white-space:nowrap; }
.step.cur{ color:#15230A; background:var(--lime); border-color:var(--lime); box-shadow:0 0 0 3px rgba(198,242,78,.28), 0 4px 14px rgba(198,242,78,.25); transform:scale(1.04); }
.step.done{ color:var(--lime); border-color:rgba(198,242,78,.6); background:rgba(198,242,78,.1); }
.flash{ animation:flashcard 1.3s ease; }
@keyframes flashcard{ 0%{ box-shadow:0 0 0 4px var(--lime); } 100%{ box-shadow:0 0 0 0 rgba(198,242,78,0); } }

/* ---------- เมนูหลักปุ่มใหญ่ ---------- */
.menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.menu-btn{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 8px 14px; color:var(--ink); font-weight:800; font-size:15px; font-family:'Prompt',sans-serif; display:flex; flex-direction:column; align-items:center; gap:6px; }
.menu-btn:active{ transform:scale(.97); }
.menu-btn .mi{ font-size:32px; line-height:1; }

/* ---------- session hero ---------- */
.sess-hero{ position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:linear-gradient(150deg,#17223F,#101832); padding:18px; margin-bottom:14px; }
.sess-hero::before{ content:""; position:absolute; right:-30px; top:-30px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(198,242,78,.14), transparent 70%); }
.sess-date{ font-family:'Prompt',sans-serif; font-size:23px; font-weight:800; margin:6px 0 2px; color:#fff; text-shadow:0 0 24px rgba(198,242,78,.25); }
.big-join{ margin-top:14px; width:100%; border:none; border-radius:14px; padding:17px; font-size:18px; font-weight:800; font-family:'Prompt',sans-serif; }
/* บรรทัดสถานที่-เวลา และยอดผู้ลงชื่อ: ขยายให้เห็นชัด */
.sess-info{ font-size:18px; font-weight:800; color:var(--ink); margin-top:6px; line-height:1.55; font-family:'Prompt',sans-serif; }
.sess-info .mgr{ display:block; font-size:13px; font-weight:600; color:var(--ink-soft); font-family:'Noto Sans Thai',sans-serif; margin-top:3px; }
.att-count{ font-size:16.5px; font-weight:800; color:var(--ink); margin-bottom:8px; font-family:'Prompt',sans-serif; }
.att-count b{ color:var(--lime); font-size:22px; }
.att-count .hint{ display:block; font-size:12px; font-weight:500; color:var(--ink-soft); font-family:'Noto Sans Thai',sans-serif; margin-top:2px; }
.court-reco{ display:flex; align-items:center; gap:12px; background:rgba(198,242,78,.08); border:1px dashed rgba(198,242,78,.4); border-radius:13px; padding:12px 14px; margin-top:14px; }
.court-reco .n{ font-family:'Prompt',sans-serif; font-size:30px; font-weight:800; color:var(--lime); line-height:1; }
.statgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.statbox{ background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
.statbox .v{ font-family:'Prompt',sans-serif; font-size:23px; font-weight:800; }
.statbox .l{ font-size:12px; color:var(--ink-soft); }

/* set cards */
.set-card{ background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:12px; margin-bottom:9px; }
.set-teams{ display:flex; align-items:center; gap:8px; }
.set-team{ flex:1; text-align:center; font-size:12.5px; font-weight:700; word-break:break-word; }
.set-team.w{ color:var(--lime); }
.set-score{ font-family:'Prompt',sans-serif; font-size:21px; font-weight:800; white-space:nowrap; }
.set-meta{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:5px; }
.court-line{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
.court-line:last-child{ border-bottom:none; }

/* summary */
.sum-total{ text-align:center; background:linear-gradient(150deg,#1A2645,#131C36); border:1px solid var(--line); border-radius:15px; padding:16px; margin-bottom:12px; }
.sum-total .n{ font-family:'Prompt',sans-serif; font-size:36px; font-weight:800; color:var(--lime); }
table.tbl{ width:100%; border-collapse:collapse; font-size:14.5px; table-layout:auto; }
table.tbl td{ word-break:break-word; }
table.tbl th{ text-align:left; color:var(--ink-soft); font-size:12.5px; font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line); }
table.tbl td{ padding:8px 4px; border-bottom:1px solid var(--line); }
table.tbl tr:last-child td{ border-bottom:none; }
.mvp-band{ display:flex; align-items:center; gap:12px; background:rgba(255,194,75,.1); border:1.5px solid rgba(255,194,75,.35); border-radius:13px; padding:14px 16px; margin-bottom:12px; animation:mvpGlow 1.6s ease-in-out infinite; }
@keyframes mvpGlow{  0%,100%{ box-shadow:0 0 0 0 rgba(255,194,75,0); border-color:rgba(255,194,75,.35); }  50%{ box-shadow:0 0 20px 3px rgba(255,194,75,.4); border-color:rgba(255,194,75,.95); } }
.mvp-star{ font-size:36px; line-height:1; animation:mvpPop 2.2s ease-in-out infinite; }
@keyframes mvpPop{ 0%,100%{ transform:scale(1) rotate(0deg); } 50%{ transform:scale(1.2) rotate(10deg); } }
.mvp-cap{ font-weight:800; font-family:'Prompt',sans-serif; font-size:13px; color:var(--ink-soft); letter-spacing:.1em; }
.mvp-name{ font-family:'Prompt',sans-serif; font-size:26px; font-weight:800; line-height:1.3; color:var(--amber); text-shadow:0 0 12px rgba(255,194,75,.6); animation:mvpBlink 1.3s ease-in-out infinite; }

    if(out && out.ok){ gasOK = true; return true; }
    if(out && out.conflict && out.data){
      // มีคนบันทึกข้อมูลใหม่กว่าไปก่อน — รับของใหม่มาใช้
      gasOK = true;
      db = out.data; lastRaw = JSON.stringify(db);
      toast("มีข้อมูลใหม่กว่าจากเพื่อนในก๊วน — อัปเดตให้แล้ว ลองทำรายการอีกครั้ง");
      if(meId) renderAll();
      return true;
    }
  }catch(e){}
  gasOK = false; return false;
}
async function claudeLoad(){
  try{
    const r = await window.storage.get(KEY, true);
    storageOK = true;
    if(r && r.value){ lastRaw = r.value; return JSON.parse(r.value); }
    return null;
  }catch(e){ storageOK = false; return null; }
}
async function storeSave(){
  db.rev = (db.rev||0)+1;
  lastRaw = JSON.stringify(db);
  const viaGas = await gasSave();                       // 1) Google Sheet
  try{
    const ok = await window.storage.set(KEY, JSON.stringify(db), true);  // 2) Claude storage (สำรอง)
    storageOK = !!ok;
  }catch(e){ storageOK = false; }
  if(gasUrl() && !viaGas) toast("⚠️ ซิงก์ Google Sheet ไม่สำเร็จ — จะลองใหม่ในการบันทึกครั้งถัดไป", true);
  updateSyncBadge();
}
function syncLabel(){
  if(gasUrl() && gasOK) return "☁️ Google Sheet (อัตโนมัติ)";
  if(gasUrl() && !gasOK) return "⚠️ Google Sheet — เชื่อมต่อไม่ได้";
  if(storageOK) return "💾 ที่เก็บข้อมูลกลางของ Claude";
  return "🚫 โหมดทดลอง";
}
function updateSyncBadge(){
  const el = document.getElementById("storageWarn");
  if(!el) return;
  el.onclick = openSyncInfo;
  el.style.cursor = "pointer";
  if(gasUrl() && gasOK){ el.style.display="none"; }
  else if(gasUrl() && !gasOK){ el.style.display="block"; el.innerHTML="⚠️ ซิงก์ไม่สำเร็จชั่วคราว — จะลองใหม่อัตโนมัติ • <u>แตะดูรายละเอียด</u>"; }
  else if(storageOK){ el.style.display="none"; }
  else { el.style.display="block"; el.innerHTML="⚠️ โหมดทดลอง — <u>แตะดูรายละเอียด</u>"; }
}

/* popup รายละเอียดการเชื่อมต่อ (อ่าน/บันทึกทำอัตโนมัติ — หน้าหลักไม่แสดงข้อความยาว) */
function openSyncInfo(){
  const ok = gasUrl() && gasOK;
  modal(`
    <div class="modal-head"><h3>☁️ สถานะการเชื่อมต่อข้อมูล</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <div class="row" style="margin-bottom:10px;"><span class="muted">สถานะตอนนี้</span><b>${syncLabel()}</b></div>
    <p class="muted" style="margin-top:0;">แอปอ่านและบันทึกข้อมูลลง Google Sheet ให้อัตโนมัติทุกครั้งที่มีการแก้ไข และดึงข้อมูลใหม่จากเพื่อนทุก 15 วินาที — ไม่ต้องกดอะไรเพิ่ม
    ${ok? "" : "<br><br>ถ้าซิงก์ไม่สำเร็จ: เช็คอินเทอร์เน็ต แล้วกด \"ลองเชื่อมต่อใหม่\" ข้อมูลที่ค้างจะถูกส่งให้เองในการบันทึกครั้งถัดไป"}</p>
    <button class="btn btn-lime btn-block" onclick="retrySync()">🔄 ลองเชื่อมต่อใหม่</button>
    ${(isAdmin()||isDefaultMgr())? `<div style="height:8px;"></div><button class="btn btn-ghost btn-block" onclick="closeModal(); openGasSetup();">⚙️ ตั้งค่าการเชื่อมต่อ (Admin/ผู้จัดการ)</button>`:""}
    <div style="height:8px;"></div>
    <button class="btn btn-ghost btn-block" onclick="closeModal()">◀️ ย้อนกลับ</button>`);
}
async function retrySync(){
  toast("กำลังเชื่อมต่อ…");
  const remote = await gasLoad();
  if(remote && (remote.rev||0) > (db.rev||0)){ db = remote; }
  await storeSave();
  updateSyncBadge(); if(meId) renderAll();
  closeModal();
  toast(gasOK? "☁️ เชื่อมต่อสำเร็จ ข้อมูลซิงก์แล้ว" : "ยังเชื่อมต่อไม่ได้ — จะลองใหม่อัตโนมัติ", !gasOK);
}

function seedDb(){
  const members = SEED.map((s,i)=>({
    id:"m"+(i+1), name:s[0], emoji:EMOJIS[i%EMOJIS.length],
    pin:null, role: s[0]===ADMIN_NAME ? "admin":"member",
    baseW:s[1], baseL:s[2]
  }));
  const admin = members.find(m=>m.name===ADMIN_NAME);
  return { rev:0, nameSyncV: NAME_SYNC_V, members, sessions:[], board:[], settings:{ defaultManagerId: admin?admin.id:members[0].id } };
}

function setLang(l){
  LANG = (l==="en"?"en":"th"); lsSet(LANG_LS, LANG);
  try{ document.documentElement.lang = LANG; }catch(e){}
  document.querySelectorAll(".langLbl").forEach(el=> el.textContent = LANG==="en" ? "ไทย" : "EN");

}

function setWinner(st){
  const a=Number(st.scoreA), b=Number(st.scoreB);
  if(a===b) return null; return a>b?"A":"B";
}
function courtCost(s){ return (s.courts||[]).reduce((t,c)=> t + (Number(c.hours)||0)*(Number(c.price)||0), 0); }
function shuttleCost(s){ return (Number(s.shuttlePrice)||0) * (Number(s.shuttlesUsed)||0); }
function totalCost(s){ return courtCost(s) + shuttleCost(s); }
function hasOverride(a){ return a.feeOverride!=null && a.feeOverride!=="" && !isNaN(Number(a.feeOverride)); }
function costSplit(s){
  const out = {};
  const att = s.attendees||[];
  if(att.length===0) return out;
  const total = totalCost(s);
  // 1) คนที่ผู้จัดการกำหนดยอดเอง (เช่น มาช้า จ่ายน้อยกว่า) — ใช้ยอดนั้นตรงๆ
  const fixed = att.filter(hasOverride);
  const flex  = att.filter(a=>!hasOverride(a));
  let fixedSum = 0;
  fixed.forEach(a=>{ const v = Math.max(0, Number(a.feeOverride)||0); out[a.memberId] = v; fixedSum += v; });
  // 2) ส่วนที่เหลือเฉลี่ยให้คนที่ไม่ได้กำหนดยอดเอง ตามโหมดหารเดิม
  const rem = Math.max(0, total - fixedSum);
  if(flex.length===0) return out;
  if(s.costMode==="hours"){
    const sum = flex.reduce((t,a)=> t+(Number(a.hours)||0), 0);
    if(sum>0){ flex.forEach(a=> out[a.memberId] = rem*(Number(a.hours)||0)/sum ); return out; }
  }
  flex.forEach(a=> out[a.memberId] = rem/flex.length );
  return out;
}
function sessionStats(s){
  const st = {};
  const blank = ()=>({w:0,l:0,sets:0,pf:0,pa:0});   // pf=แต้มได้ pa=แต้มเสีย
  (s.attendees||[]).forEach(a=> st[a.memberId] = blank());
  (s.sets||[]).forEach(x=>{
    const w = setWinner(x); if(!w) return;
    const win  = w==="A"? x.teamA : x.teamB;
    const lose = w==="A"? x.teamB : x.teamA;
    const wS = w==="A"? Number(x.scoreA)||0 : Number(x.scoreB)||0;
    const lS = w==="A"? Number(x.scoreB)||0 : Number(x.scoreA)||0;
    win.forEach(id=>{ if(!st[id]) st[id]=blank(); st[id].w++; st[id].sets++; st[id].pf+=wS; st[id].pa+=lS; });
    lose.forEach(id=>{ if(!st[id]) st[id]=blank(); st[id].l++; st[id].sets++; st[id].pf+=lS; st[id].pa+=wS; });
  });
  return st;
}
/* MVP: เซ็ตชนะมากสุดก่อน — ถ้าเสมอ ใช้แต้มต่างรวม (ได้−เสีย) ตัดสิน ถ้ายังเสมออีกเป็น MVP ร่วม */
function sessionMVP(s){
  const st = sessionStats(s);
  const ids = Object.keys(st).filter(id=> st[id].w>0);
  if(!ids.length) return [];
  const key = id => [st[id].w, st[id].pf-st[id].pa];
  let best = null;
  ids.forEach(id=>{
    const k = key(id);
    if(!best || k[0]>best[0] || (k[0]===best[0] && k[1]>best[1])) best = k;
  });
  return ids.filter(id=>{ const k=key(id); return k[0]===best[0] && k[1]===best[1]; });
}

async function pinKey(k){
  if(k==="del"){ pinBuf = pinBuf.slice(0,-1); renderLogin(); return; }
  if(pinBuf.length>=4) return;
  pinBuf += k; renderLogin();
  if(pinBuf.length<4) return;
  const m = mem(loginPick);
  await new Promise(r=>setTimeout(r,120));
  if(pinStage==="set"){ pinFirst=pinBuf; pinBuf=""; pinStage="confirm"; renderLogin(); return; }
  if(pinStage==="confirm"){
    if(pinBuf===pinFirst){
      m.pin = pinBuf; await storeSave();
      loginDone();
    } else { toast("PIN ไม่ตรงกัน ลองใหม่อีกครั้ง", true); pinBuf=""; pinFirst=""; pinStage="set"; renderLogin(); }
    return;
  }
  // enter
  if(pinBuf===m.pin){ loginDone(); }
  else { toast("PIN ไม่ถูกต้อง", true); pinBuf=""; renderLogin(); }
}

      ${annB? `<div class="banner-board blink" onclick="openBoard()">📢 <b>${emojiOf(annB.from)} ${esc(nameOf(annB.from))}:</b> <span class="bmsg notx">${esc(annB.text)}</span> <span class="muted" style="font-size:11px;">• ${boardWhen(annB.at)}</span></div>`
           : `<div class="banner-board" onclick="openBoard()" style="color:var(--ink-soft);">📢 ยังไม่มีประกาศจากผู้จัดการ — แตะเพื่อเปิดกระดานสื่อสารก๊วน</div>`}
      ${msgB? `<div class="banner-board" onclick="openBoard()" style="background:rgba(255,255,255,.05); border-color:var(--line);">💬 <b>${emojiOf(msgB.from)} ${esc(nameOf(msgB.from))}:</b> <span class="notx">${esc(msgB.text)}</span> <span class="muted" style="font-size:11px;">• ${boardWhen(msgB.at)}</span></div>`:""}
    </div>
    <button class="board-write" onclick="openBoard()">✍️ เขียน</button>
  </div>`;

  // 💰 แจ้งเตือนผู้จัดการ/Admin: มีรายการชำระเงินรออนุมัติ
  const pend = pendingApprovals();
  if(pend.length){
    html += `<div class="banner-approve" onclick="openPendingList()">💰 <b>มีการแจ้งชำระเงินรออนุมัติ ${pend.length} รายการ</b> — แตะเพื่อตรวจและกดอนุมัติ</div>`;
  }

  // ⚡ แจ้งเตือน Admin: มีคำขอ Turn Pro รออนุมัติ
  if(isAdmin() && proPending().length){
    html += `<div class="banner-approve" onclick="openProAdmin()">⚡ <b>มีคำขอ Turn Pro รออนุมัติ ${proPending().length} รายการ</b> — แตะเพื่อตรวจและกดอนุมัติ</div>`;
  }

  if(!s){
    html += `<div class="sess-hero" style="text-align:center;">
      ${stepper(1)}
      <div style="font-size:36px;">🏸</div>
      <div class="sess-date">ยังไม่มีนัดตีที่เปิดอยู่</div>
      <div class="muted">${canOpenSession() ? "ขั้นที่ 1: กำหนดวันตีและสถานที่ เพื่อเปิดให้สมาชิกลงชื่อล่วงหน้า" : "รอ Admin หรือผู้จัดการเปิดนัดถัดไป"}</div>
      ${canOpenSession() ? `<button class="btn btn-lime big-join" onclick="openNewSession()">📅 กำหนดวันตี & เปิดนัดใหม่</button>`:""}
    </div>`;
  } else if(s.status==="open"){
    html += renderOpenSession(s);
  } else {
    html += renderPlayingSession(s);
  }

  // เมนูหลัก — ปุ่มใหญ่ 4 ปุ่ม รายละเอียดทั้งหมดเปิดเป็น popup
  const fbCount = (db.feedback||[]).length;
  html += `<div class="menu-grid">
    <button class="menu-btn" onclick="openPastList()"><span class="mi">🏁</span>สรุปนัดที่ผ่านมา</button>
    <button class="menu-btn" onclick="openPayNow()"><span class="mi">💰</span>จ่ายเงินค่าตี</button>
    <button class="menu-btn" onclick="openFeedbackMenu()"><span class="mi">💬</span>ความคิดเห็น${isAdmin()&&fbCount? ` (${fbCount})`:""}</button>
    <button class="menu-btn" onclick="openManageMenu()"><span class="mi">⚙️</span>จัดการก๊วน</button>
  </div>`;
  v.innerHTML = html;
}

function togglePastAll(){ window.__pastAll = !window.__pastAll; openPastList(); }
function openPastList(){
  const allDone = db.sessions.filter(x=>x.status==="done").sort((a,b)=> b.date.localeCompare(a.date));
  const done = allDone.slice(0, window.__pastAll? 999 : 8);
  const moreBtn = allDone.length > done.length
    ? `<button class="btn btn-blue btn-block" style="margin-bottom:10px;" onclick="togglePastAll()">ดูทั้งหมด (${allDone.length} นัด)</button>`
    : (window.__pastAll && allDone.length > 8
      ? `<button class="btn btn-ghost btn-block" style="margin-bottom:10px;" onclick="togglePastAll()">แสดงเฉพาะ 8 นัดล่าสุด</button>`
      : "");
  modal(`
    <div class="modal-head"><h3>🏁 สรุปนัดที่ผ่านมา</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    ${done.length? done.map(x=>`
      <button class="btn btn-ghost btn-block" style="margin-bottom:10px; text-align:left; display:flex; justify-content:space-between; align-items:center;" onclick="openSummary('${x.id}')">
        <span>📊 ${fmtDateShort(x.date)} • ${x.attendees.length} คน</span>
        <b style="color:var(--lime);">${money(totalCost(x))}</b>
      </button>`).join("") : '<div class="empty"><div class="big">🏁</div>ยังไม่มีนัดที่จบ</div>'}
    ${moreBtn}
    <button class="btn btn-ghost btn-block" onclick="closeModal()">◀️ ย้อนกลับ</button>`);
}

/* =====================================================
   กระดานสื่อสารก๊วน (กระดานเดียวทั้งก๊วน)
   — Admin/ผู้จัดการ(ค่าเริ่มต้น) เขียน = ประกาศกระพริบบนหน้าแรก
   — สมาชิกทุกคนเปิดอ่านและตอบโต้ได้
   ===================================================== */
function isMgrRole(id){ const m=mem(id); return !!m && (m.role==="admin" || id===db.settings.defaultManagerId); }
/* ข้อความล่าสุดบนกระดาน (จากใครก็ได้) — แสดงบน banner หน้าแรกเป็นอันดับแรก */
function boardAnn(){
  const list = db.board||[];
  return list.length? list[list.length-1] : null;
}
/* ประเภทข้อความ: "ann" = ประกาศ, "msg" = ทั่วไป — ข้อความเก่าไม่มี type ให้ถือว่าเป็นประกาศถ้าผู้ส่งเป็น Admin/ผู้จัดการ */
function boardIsAnn(b){ return b.type? b.type==="ann" : isMgrRole(b.from); }
function boardLatest(ann){
  const list = db.board||[];
  for(let i=list.length-1; i>=0; i--){ if(boardIsAnn(list[i])===ann) return list[i]; }
  return null;
}
function boardWhen(ts){
  try{ return new Date(ts).toLocaleString(loc(),{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
}
function openBoard(){
  window.__brdType = "msg";   // ค่าเริ่มต้น: ข้อความทั่วไป
  const list = (db.board||[]).slice(-60).reverse();   // ข้อความล่าสุดขึ้นก่อน
  const rows = list.map(b=>{
    const m = mem(b.from);
    const own = b.from===meId;
    const annCls = boardIsAnn(b)? "ann":"";
    return `<div class="brd-msg ${own?"own":""} ${annCls}">
      <div class="brd-head"><b>${m? m.emoji+" "+esc(m.name):"?"}</b>
        ${boardIsAnn(b)? `<span class="tag tag-mgr" style="font-size:9.5px; padding:1px 6px;">ประกาศ</span>`:""}
        <span style="flex:1;">• ${boardWhen(b.at)}</span>
        ${(own||isAdmin())? `<span style="color:var(--coral); cursor:pointer; font-weight:700;" onclick="delBoardMsg('${b.id}')">✕</span>`:""}
      </div>
      <div class="notx">${esc(b.text)}</div>
    </div>`;
  }).join("") || `<div class="empty"><div class="big">💬</div>ยังไม่มีข้อความ — เริ่มคุยกันเลย</div>`;
  const mgr = isMgrRole(meId);
  modal(`
    <div class="modal-head"><h3>📢 กระดานสื่อสารก๊วน</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <p class="muted" style="margin-top:0; font-size:11.5px;">หน้าแรกจะแสดง 2 ข้อความ: 📢 ประกาศล่าสุด และ 💬 ข้อความทั่วไปล่าสุด</p>
    <div id="brdList" style="max-height:40vh; overflow:auto; margin-bottom:10px;">${rows}</div>
    <div class="frow" style="margin-bottom:8px;">
      <button id="btMsg" class="btn btn-sm btn-lime" style="flex:1;" onclick="setBrdType('msg')">💬 ข้อความทั่วไป</button>
      <button id="btAnn" class="btn btn-sm btn-ghost" style="flex:1; ${mgr?"":"opacity:.45;"}" onclick="setBrdType('ann')">📢 ประกาศ${mgr?"":" 🔒"}</button>
    </div>
    <div class="field"><textarea id="brdInp" rows="2" maxlength="300" placeholder="พิมพ์ข้อความถึงก๊วน…" style="width:100%; background:rgba(255,255,255,.06); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:10px; font-family:inherit; font-size:14px; resize:none;"></textarea></div>
    <button class="btn btn-lime btn-block" onclick="postBoardMsg()">📨 ส่งข้อความ</button>`);
  const el = $("brdList"); if(el) el.scrollTop = 0;   // ล่าสุดอยู่บนสุด
}
function setBrdType(t){
  if(t==="ann" && !isMgrRole(meId)) return toast("ประกาศส่งได้เฉพาะ Admin/ผู้จัดการ — สมาชิกส่งข้อความทั่วไปได้เลย", true);
  window.__brdType = t;
  const bm = $("btMsg"), ba = $("btAnn");
  if(bm) bm.className = "btn btn-sm " + (t==="msg"? "btn-lime":"btn-ghost");
  if(ba) ba.className = "btn btn-sm " + (t==="ann"? "btn-lime":"btn-ghost");
}
async function postBoardMsg(){
  const inp = $("brdInp"); if(!inp) return;
  const v = inp.value.trim();
  if(!v) return toast("พิมพ์ข้อความก่อนนะ", true);
  const type = (window.__brdType==="ann" && isMgrRole(meId))? "ann" : "msg";
  db.board = db.board||[];
  db.board.push({ id:uid(), from:meId, text:v.slice(0,300), at:Date.now(), type });
  if(db.board.length>200) db.board = db.board.slice(-200);
  await storeSave();
  closeModal(); renderAll();   // ส่งแล้วปิดกล่องอัตโนมัติ
  toast(type==="ann"? "ส่งประกาศแล้ว 📢" : "ส่งข้อความแล้ว 📨");
}
async function delBoardMsg(id){
  const b = (db.board||[]).find(x=>x.id===id); if(!b) return;
  if(!(b.from===meId || isAdmin())) return;
  if(!confirm("ลบข้อความนี้?")) return;
  db.board = db.board.filter(x=>x.id!==id);
  await storeSave(); openBoard(); renderAll();
}

/* ---------- ข้อความสั้นข้างชื่อในรายชื่อผู้ลงชื่อ ---------- */
function openAttNote(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const a = s.attendees.find(x=>x.memberId===meId);
  if(!a) return toast("ลงชื่อก่อนจึงเขียนข้อความได้", true);
  modal(`
    <div class="modal-head"><h3>📝 ข้อความของฉันในนัดนี้</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <p class="muted" style="margin-top:0;">ข้อความสั้นๆ จะแสดงข้างชื่อคุณในรายชื่อผู้ลงชื่อ เช่น ไปถึง 19.00 / รับเพื่อนได้ 1 คน</p>
    <div class="field"><input type="text" id="attNoteInp" maxlength="60" value="${esc(a.note||"")}" placeholder="พิมพ์ข้อความสั้นๆ…"></div>
    <button class="btn btn-lime btn-block" onclick="saveAttNote('${sid}')">💾 บันทึกข้อความ</button>
    ${a.note? `<div style="height:8px;"></div><button class="btn btn-danger btn-block" onclick="clearAttNote('${sid}')">ลบข้อความ</button>`:""}`);
  const inp = $("attNoteInp"); if(inp){ inp.focus(); }
}
async function saveAttNote(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const a = s.attendees.find(x=>x.memberId===meId); if(!a) return;
  a.note = ($("attNoteInp").value||"").trim().slice(0,60);
  await storeSave(); closeModal(); renderAll();
  toast(a.note? "บันทึกข้อความแล้ว" : "ลบข้อความแล้ว");
}
async function clearAttNote(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const a = s.attendees.find(x=>x.memberId===meId); if(!a) return;
  a.note = "";
  await storeSave(); closeModal(); renderAll();
  toast("ลบข้อความแล้ว");
}

      ${n===0 ? `<div class="empty" style="padding:12px;"><div class="big">👀</div>ยังไม่มีใครลงชื่อ — เป็นคนแรกเลย!</div>` :

          </div>`;

    ${joined

    <div class="statgrid">

      <div class="statbox"><div class="v">${nc}</div><div class="l">คอร์ทที่ควรจอง</div></div>
      <div class="statbox"><div class="v">${PLAYERS_PER_COURT}</div><div class="l">คน/คอร์ท</div></div>

    <button class="btn btn-ghost big-join" onclick="copyAnnounce('${s.id}')">📋 คัดลอกประกาศนัด → วางในไลน์กลุ่ม</button>

    `:""}

/* ---------- สถานะ: กำลังตี ---------- */
function renderPlayingSession(s){
  const isAtt = s.attendees.some(a=>a.memberId===meId);
  const canRecord = isAtt || canManage(s);
  const st = sessionStats(s);
  const totalSets = (s.sets||[]).length;
  const mgr = mem(s.managerId);

  const setList = [...(s.sets||[])].reverse().map(x=>{
    const w = setWinner(x);
    const canDel = canManage(s) || x.recordedBy===meId;
    const canEd = canEditSet(s, x);
    return `<div class="set-card">
      <div class="set-teams">
        <div class="set-team ${w==="A"?"w":""}">${teamLabel(x.teamA)}</div>
        <div class="set-score">${x.scoreA} : ${x.scoreB}</div>
        <div class="set-team ${w==="B"?"w":""}">${teamLabel(x.teamB)}</div>
      </div>
      <div class="set-meta">คอร์ท ${esc(x.court)} • บันทึกโดย ${emojiOf(x.recordedBy)} ${esc(nameOf(x.recordedBy))} ${x.shuttle?"• 🔄 เปลี่ยนลูก":""}${x.editedBy?` • ✏️ แก้โดย ${emojiOf(x.editedBy)} ${esc(nameOf(x.editedBy))}`:""}
        ${canEd? ` <span style="color:var(--blue); cursor:pointer; font-weight:700;" onclick="openEditSet('${s.id}','${x.id}')">✏️ แก้ไข</span>`:""}
        ${canDel? ` <span style="color:var(--coral); cursor:pointer; font-weight:700;" onclick="delSet('${s.id}','${x.id}')">✕ ลบ</span>`:""}
      </div>
    </div>`;
  }).join("") || `<div class="empty"><div class="big">🏸</div>ยังไม่มีเซ็ตที่บันทึก — เริ่มบันทึกเซ็ตแรกกันเลย</div>`;

  const courtRows = (s.courts||[]).map(c=>
    `<div class="court-line"><span style="font-weight:700;">คอร์ท ${esc(c.no)}</span><span class="muted" style="flex:1;">${c.hours} ชม. × ${money(c.price)}/ชม.</span><b>${money((Number(c.hours)||0)*(Number(c.price)||0))}</b></div>`
  ).join("");

  return `
  <div class="sess-hero">
    ${stepper(4, s.id)}
    <div class="row">
      <span class="tag tag-play">● ขั้นที่ 4: กำลังตี — บันทึกเซ็ตกันเลย</span>
    </div>
    <div class="sess-date">${fmtDate(s.date)}</div>
    <div class="sess-info">📍 ${esc(s.loc||"-")} • ⏰ ${esc(s.time||"-")}<span class="mgr">ผู้จัดการนัด ${mgr? mgr.emoji+" "+esc(mgr.name):"-"}</span></div>
    <div class="statgrid">
      <div class="statbox"><div class="v">${s.attendees.length}</div><div class="l">ผู้เล่น</div></div>
      <div class="statbox"><div class="v">${(s.courts||[]).length}</div><div class="l">คอร์ท</div></div>
      <div class="statbox"><div class="v">${totalSets}</div><div class="l">เซ็ตที่ตีแล้ว</div></div>
    </div>
    <button class="btn btn-lime big-join" onclick="jumpToSetForm()">🏸 บันทึกเซ็ต — ใส่ผลตีรอบนี้</button>
    <div class="frow" style="margin-top:8px;">
      ${canManage(s)? `<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openStartPlay('${s.id}')">🏟️ เพิ่ม/แก้ไขคอร์ท</button>`:""}
      <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openEditAttendees('${s.id}')">🙋 เพิ่ม/แก้ไขคนตี</button>
    </div>
    ${canManage(s)? `<button class="btn btn-blue big-join" onclick="finishSession('${s.id}')">🏁 ขั้นที่ 5: สรุปผล — จบนัดนี้</button>`
      : `<div class="muted" style="margin-top:12px; text-align:center;">ผู้จัดการนัดจะเป็นคนกด "สรุปผล" เมื่อเลิกตี</div>`}
    ${stageBar(s)}
  </div>

  <div class="card">
    <h3>🏟️ ข้อมูลคอร์ท</h3>
    ${courtRows || '<div class="muted">ยังไม่กรอกข้อมูลคอร์ท</div>'}
    <div class="divider"></div>
    <div class="row"><span class="muted">ค่าลูกขนไก่</span><span>${s.shuttlesUsed||0} ลูก × ${money(s.shuttlePrice||0)} = <b>${money(shuttleCost(s))}</b></span></div>
  </div>

  <div class="card" id="setFormCard">
    <h3>✍️ บันทึกเซ็ต <span class="muted" style="font-weight:400;">(สมาชิกที่มาตีช่วยกันบันทึกได้)</span></h3>
    <button class="btn btn-ghost btn-sm btn-block" style="margin-bottom:10px;" onclick="openEditAttendees('${s.id}')">✏️ เพิ่ม / แก้ไขคนเข้าตี (ตอนนี้ ${s.attendees.length} คน)</button>
    ${canRecord ? renderSetForm(s) : `<div class="muted">เฉพาะผู้ที่ลงชื่อเข้าร่วมนัดนี้จึงบันทึกผลได้</div>`}
  </div>

  <div class="card">
    <h3>📜 เซ็ตทั้งหมด (${totalSets})</h3>
    ${setList}
    ${totalSets? `<div style="height:10px;"></div><button class="btn btn-ghost btn-block" onclick="copyPlayingUpdate('${s.id}')">📋 คัดลอกผลสด → วางในไลน์กลุ่ม</button>`:""}
  </div>`;
}

function renderSetForm(s){
  const chipRow = (team) => s.attendees.map(a=>{
    const m = mem(a.memberId); if(!m) return "";
    const arr = team==="A"? setDraft.teamA : setDraft.teamB;
    const cls = arr.includes(m.id) ? (team==="A"?"pa":"pb") : "";
    return `<span class="chip ${cls}" onclick="pickSetTeam('${team}','${m.id}')"><span class="av">${m.emoji}</span>${esc(m.name)}</span>`;
  }).join("");
  const courtOpts = (s.courts||[]).map(c=>`<option value="${esc(c.no)}" ${String(setDraft.court)===String(c.no)?"selected":""}>คอร์ท ${esc(c.no)}</option>`).join("");
  return `
    <div class="field"><label class="setlbl">คอร์ทที่เล่น</label><select onchange="setDraft.court=this.value">${courtOpts||'<option value="">-</option>'}</select></div>
    <div class="field"><label class="setlbl ta">ทีม A — แตะเลือก 1-2 คน</label><div class="chips">${chipRow("A")}</div></div>
    <div class="field"><label class="setlbl tb">ทีม B — แตะเลือก 1-2 คน</label><div class="chips">${chipRow("B")}</div></div>
    <div class="frow">
      <div class="field"><label class="setlbl ta">คะแนนทีม A</label><input type="number" min="0" max="99" value="${setDraft.scoreA}" oninput="setDraft.scoreA=this.value"></div>
      <div class="field"><label class="setlbl tb">คะแนนทีม B</label><input type="number" min="0" max="99" value="${setDraft.scoreB}" oninput="setDraft.scoreB=this.value"></div>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="shChk" style="width:auto;" ${setDraft.shuttle?"checked":""} onchange="setDraft.shuttle=this.checked">
      <label for="shChk" class="setlbl sh" style="margin:0;">🔄 เปลี่ยนลูกขนไก่ในเซ็ตนี้</label>
    </div>
    <button class="btn btn-lime btn-block" onclick="addSet('${s.id}')">+ บันทึกเซ็ตนี้</button>`;
}

function pickSetTeam(team, id){
  const mine = team==="A"? setDraft.teamA : setDraft.teamB;
  const other = team==="A"? setDraft.teamB : setDraft.teamA;
  const oi = other.indexOf(id); if(oi>=0) other.splice(oi,1);
  const i = mine.indexOf(id);
  if(i>=0) mine.splice(i,1);
  else if(mine.length<2) mine.push(id);
  else { toast("ทีมละไม่เกิน 2 คน", true); return; }
  renderAll();
}
async function addSet(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const d = setDraft;
  if(d.teamA.length===0 || d.teamB.length===0) return toast("เลือกผู้เล่นทั้งสองทีมก่อน", true);
  if(d.scoreA==="" || d.scoreB==="") return toast("กรอกคะแนนให้ครบทั้งสองทีม", true);
  if(Number(d.scoreA)===Number(d.scoreB)) return toast("คะแนนเท่ากันไม่ได้ ต้องมีทีมชนะ", true);
  s.sets.push({ id:uid(), court:d.court||((s.courts[0]||{}).no||"-"), teamA:[...d.teamA], teamB:[...d.teamB],
    scoreA:Number(d.scoreA), scoreB:Number(d.scoreB), shuttle:!!d.shuttle, recordedBy:meId, at:Date.now() });
  if(d.shuttle) s.shuttlesUsed = (Number(s.shuttlesUsed)||0) + 1;
  await storeSave();
  setDraft = { court:d.court, teamA:[], teamB:[], scoreA:"", scoreB:"", shuttle:false };
  renderAll(); toast("บันทึกเซ็ตแล้ว 🏸");
}
async function delSet(sid, setId){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const st = s.sets.find(x=>x.id===setId);
  if(!(canManage(s) || (st && st.recordedBy===meId))) return toast("ไม่มีสิทธิ์ลบเซ็ตนี้", true);
  if(!confirm("ลบเซ็ตนี้?")) return;
  if(st && st.shuttle && (Number(s.shuttlesUsed)||0)>0) s.shuttlesUsed = Number(s.shuttlesUsed)-1;
  s.sets = s.sets.filter(x=>x.id!==setId);
  await storeSave(); renderAll();
}

/* ---------- แก้ไขเซ็ตที่บันทึกแล้ว (Admin ทุกเซ็ตทุกนัด • ผู้จัดการ/ผู้บันทึกแก้ในนัดที่ยังไม่จบ) ---------- */
let editSetDraft = null;
function openEditSet(sid, setId){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const x = (s.sets||[]).find(t=>t.id===setId); if(!x) return;
  if(!canEditSet(s, x)) return toast("ไม่มีสิทธิ์แก้ไขเซ็ตนี้", true);
  editSetDraft = { sid, setId, court:String(x.court||""), teamA:[...x.teamA], teamB:[...x.teamB],
    scoreA:String(x.scoreA), scoreB:String(x.scoreB), shuttle:!!x.shuttle };
  renderEditSetModal();
}
function renderEditSetModal(){
  const d = editSetDraft; if(!d) return;
  const s = db.sessions.find(x=>x.id===d.sid); if(!s) return;
  // เลือกได้จากผู้ลงชื่อในนัด + คนที่อยู่ในเซ็ตเดิม (เผื่อถูกถอนชื่อไปแล้ว)
  const ids = [...new Set([...s.attendees.map(a=>a.memberId), ...d.teamA, ...d.teamB])];
  const chipRow = (team)=> ids.map(id=>{
    const m = mem(id); if(!m) return "";
    const arr = team==="A"? d.teamA : d.teamB;
    const cls = arr.includes(id)? (team==="A"?"pa":"pb"):"";
    return `<span class="chip ${cls}" onclick="pickEditSetTeam('${team}','${id}')"><span class="av">${m.emoji}</span>${esc(m.name)}</span>`;
  }).join("");
  const courtSet = [...new Set([...(s.courts||[]).map(c=>String(c.no)), String(d.court)])].filter(Boolean);
  const courtOpts = courtSet.map(no=>`<option value="${esc(no)}" ${String(d.court)===String(no)?"selected":""}>คอร์ท ${esc(no)}</option>`).join("");
  modal(`
    <div class="modal-head"><h3>✏️ แก้ไขเซ็ต</h3><button class="mclose" onclick="closeEditSet()">✕</button></div>
    ${s.status==="done"? `<p class="muted" style="margin-top:0;">นัดนี้สรุปผลแล้ว — การแก้ไขจะอัปเดตสถิติและจำนวนลูกอัตโนมัติ</p>`:""}
    <div class="field"><label class="setlbl">คอร์ทที่เล่น</label><select onchange="editSetDraft.court=this.value">${courtOpts||'<option value="">-</option>'}</select></div>
    <div class="field"><label class="setlbl ta">ทีม A — แตะเลือก 1-2 คน</label><div class="chips">${chipRow("A")}</div></div>
    <div class="field"><label class="setlbl tb">ทีม B — แตะเลือก 1-2 คน</label><div class="chips">${chipRow("B")}</div></div>
    <div class="frow">
      <div class="field"><label class="setlbl ta">คะแนนทีม A</label><input type="number" min="0" max="99" value="${d.scoreA}" oninput="editSetDraft.scoreA=this.value"></div>
      <div class="field"><label class="setlbl tb">คะแนนทีม B</label><input type="number" min="0" max="99" value="${d.scoreB}" oninput="editSetDraft.scoreB=this.value"></div>
    </div>
    <div class="field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="esShChk" style="width:auto;" ${d.shuttle?"checked":""} onchange="editSetDraft.shuttle=this.checked">
      <label for="esShChk" class="setlbl sh" style="margin:0;">🔄 เปลี่ยนลูกขนไก่ในเซ็ตนี้</label>
    </div>
    <button class="btn btn-lime btn-block" onclick="saveEditSet()">💾 บันทึกการแก้ไข</button>
    <div style="height:8px;"></div>
    <button class="btn btn-ghost btn-block" onclick="closeEditSet()">ยกเลิก</button>`);
}
function pickEditSetTeam(team, id){
  const d = editSetDraft; if(!d) return;
  const mine = team==="A"? d.teamA : d.teamB;
  const other = team==="A"? d.teamB : d.teamA;
  const oi = other.indexOf(id); if(oi>=0) other.splice(oi,1);
  const i = mine.indexOf(id);
  if(i>=0) mine.splice(i,1);
  else if(mine.length<2) mine.push(id);
  else { toast("ทีมละไม่เกิน 2 คน", true); return; }
  renderEditSetModal();
}
function closeEditSet(){
  const d = editSetDraft; editSetDraft = null;
  if(d){
    const s = db.sessions.find(x=>x.id===d.sid);
    if(s && s.status==="done") return openSummary(d.sid);
  }
  closeModal();
}
async function saveEditSet(){
  const d = editSetDraft; if(!d) return;
  const s = db.sessions.find(x=>x.id===d.sid); if(!s) return;
  const x = (s.sets||[]).find(t=>t.id===d.setId); if(!x) return;
  if(!canEditSet(s, x)) return toast("ไม่มีสิทธิ์แก้ไขเซ็ตนี้", true);
  if(d.teamA.length===0 || d.teamB.length===0) return toast("เลือกผู้เล่นทั้งสองทีมก่อน", true);
  if(d.scoreA==="" || d.scoreB==="") return toast("กรอกคะแนนให้ครบทั้งสองทีม", true);
  if(Number(d.scoreA)===Number(d.scoreB)) return toast("คะแนนเท่ากันไม่ได้ ต้องมีทีมชนะ", true);
  if(!!d.shuttle !== !!x.shuttle){
    if(d.shuttle) s.shuttlesUsed = (Number(s.shuttlesUsed)||0) + 1;
    else if((Number(s.shuttlesUsed)||0) > 0) s.shuttlesUsed = Number(s.shuttlesUsed) - 1;
  }
  x.court = d.court || x.court;
  x.teamA = [...d.teamA]; x.teamB = [...d.teamB];
  x.scoreA = Number(d.scoreA); x.scoreB = Number(d.scoreB);
  x.shuttle = !!d.shuttle;
  x.editedBy = meId; x.editedAt = Date.now();
  await storeSave();
  editSetDraft = null;
  renderAll();
  if(s.status==="done") openSummary(s.id); else closeModal();
  toast("บันทึกการแก้ไขเซ็ตแล้ว ✏️");
}

/* ---------- แถบปุ่มประจำขั้นตอน: ย้อนกลับ / บันทึก / แก้ไข ---------- */
function stageBar(s){
  const mg = canManage(s);
  const editFn = s.status==="open" ? `openEditSession('${s.id}')` : `openStartPlay('${s.id}')`;
  return `<div class="frow" style="margin-top:12px;">
    ${mg? `<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="stepBack('${s.id}')">◀️ ย้อนกลับ</button>`:""}
    <button class="btn btn-blue btn-sm" style="flex:1;" onclick="manualSave()">💾 บันทึก</button>
    ${mg? `<button class="btn btn-ghost btn-sm" style="flex:1;" onclick="${editFn}">✏️ แก้ไข</button>`:""}
  </div>`;
}
async function manualSave(){
  await storeSave(); renderAll();
  if(!(gasUrl() && !gasOK)) toast("💾 บันทึกและซิงก์ข้อมูลแล้ว");
}
async function stepBack(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  if(s.status==="playing"){
    if(!confirm("ย้อนกลับไปขั้นที่ 2 (เปิดรับลงชื่อ)?\nข้อมูลคอร์ทและเซ็ตที่บันทึกไว้ยังอยู่ครบ")) return;
    s.status="open"; await storeSave(); renderAll(); toast("◀️ กลับสู่ขั้นเปิดรับลงชื่อแล้ว");
  } else if(s.status==="open"){
    if(!confirm("ย้อนกลับจากขั้นนี้ = ยกเลิกนัดนี้ทั้งหมด\nยืนยันยกเลิกนัด?")) return;
    db.sessions = db.sessions.filter(x=>x.id!==sid);
    await storeSave(); renderAll(); toast("ยกเลิกนัดแล้ว");
  }
}
async function reopenSession(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  if(!confirm("เปิดนัดนี้กลับเป็นสถานะ \"กำลังตี\" เพื่อแก้ไขข้อมูล?")) return;
  s.status="playing"; await storeSave(); closeModal(); go("play"); toast("↩️ เปิดนัดกลับมาแก้ไขได้แล้ว");
}

/* ---------- แก้ไขการลงชื่อแทนสมาชิก (ทุกคนใช้ได้ ทั้งขั้นลงชื่อและขั้นกำลังตี) ---------- */
function openEditAttendees(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || s.status==="done") return;
  const inSets = {}; (s.sets||[]).forEach(x=>[...x.teamA, ...x.teamB].forEach(id=> inSets[id]=true));
  const rows = memberSort(db.members).map(m=>{
    const joined = s.attendees.some(a=>a.memberId===m.id);
    const locked = joined && inSets[m.id];
    return `<div class="court-line">
      <span style="flex:1;">${m.emoji} ${esc(m.name)}${m.id===meId?' <span class="muted">(คุณ)</span>':""}${locked?' <span class="muted" style="font-size:10.5px;">🔒 มีเซ็ตบันทึกแล้ว</span>':""}</span>
      ${joined
        ? `<button class="btn ${locked?"btn-ghost":"btn-danger"} btn-sm" onclick="editAttToggle('${sid}','${m.id}')">${locked?"✓ ร่วมตี":"− ถอนชื่อ"}</button>`
        : `<button class="btn btn-lime btn-sm" onclick="editAttToggle('${sid}','${m.id}')">+ ลงชื่อ</button>`}
    </div>`;
  }).join("");
  modal(`
    <div class="modal-head"><h3>✏️ แก้ไขการลงชื่อ (${s.attendees.length} คน)</h3><button class="mclose" onclick="closeModal()">✕</button></div>
    <p class="muted" style="margin-top:-4px;">นัด ${fmtDateShort(s.date)} — แตะ <b>+ ลงชื่อ</b> เพื่อลงชื่อแทนเพื่อน หรือ <b>− ถอนชื่อ</b> เพื่อถอนออก<br>คนที่มีผลเซ็ตบันทึกแล้วจะถอนชื่อไม่ได้ (ต้องลบเซ็ตนั้นก่อน)</p>
    ${rows}
    <div style="height:12px;"></div>
    <button class="btn btn-lime btn-block" onclick="closeModal(); renderAll();">✓ เสร็จแล้ว</button>`);
}
async function editAttToggle(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || s.status==="done") return;
  const i = s.attendees.findIndex(a=>a.memberId===mid);
  if(i>=0){
    const usedInSet = (s.sets||[]).some(x=> x.teamA.includes(mid) || x.teamB.includes(mid));
    if(usedInSet) return toast("มีผลเซ็ตของ "+nameOf(mid)+" บันทึกไว้ — ต้องลบเซ็ตนั้นก่อนจึงถอนชื่อได้", true);
    if(!confirm("ถอนชื่อ "+nameOf(mid)+" ออกจากนัดวันที่ "+fmtDateShort(s.date)+"?")) return;
    s.attendees.splice(i,1);
    // กันข้อมูลค้าง: ถ้าคนนี้ถูกเลือกอยู่ในฟอร์มบันทึกเซ็ต ให้เอาออกด้วย
    setDraft.teamA = setDraft.teamA.filter(id=>id!==mid);
    setDraft.teamB = setDraft.teamB.filter(id=>id!==mid);
    toast("ถอนชื่อ "+nameOf(mid)+" แล้ว");
  } else {
    s.attendees.push({ memberId:mid, hours:2, joinedAt:Date.now(), addedBy:meId });
    toast("ลงชื่อ "+nameOf(mid)+" เข้าร่วมแล้ว 🙌");
  }
  await storeSave(); renderAll(); openEditAttendees(sid);
}

/* ---------- join / leave ---------- */
async function toggleJoin(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || s.status!=="open") return;
  const i = s.attendees.findIndex(a=>a.memberId===meId);
  if(i>=0){
    if(!confirm("ยืนยันถอนชื่อออกจากนัดวันที่ "+fmtDateShort(s.date)+"?")) return;
    s.attendees.splice(i,1); toast("ถอนชื่อออกจากนัดแล้ว");
  }
  else { s.attendees.push({ memberId:meId, hours:2, joinedAt:Date.now() }); toast("ลงชื่อเข้าร่วมแล้ว 🙌"); }
  await storeSave(); renderAll();
}

    ทำครั้งเดียว: เปิด Google Sheet → ส่วนขยาย → Apps Script → วางโค้ดจากไฟล์ <b>google-apps-script-Code.gs</b> → Deploy เป็น Web app (Execute as: Me, Access: Anyone) → คัดลอก URL มาวางด้านล่าง (ขั้นตอนละเอียดอยู่ใน README)</p>

}
async function saveGas(){
  const url = $("gasInp").value.trim();
  if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url))
    return toast("URL ต้องขึ้นต้นด้วย https://script.google.com/", true);
  window.__gasOverride = url || null;
  if(!db.settings) db.settings = {};
  db.settings.gasUrl = url;
  if(url){
    toast("กำลังทดสอบการเชื่อมต่อ…");
    const remote = await gasLoad();
    if(!gasOK){
      toast("เชื่อมต่อไม่สำเร็จ — ตรวจว่า Deploy แบบ \"Anyone\" และใช้ URL ที่ลงท้ายด้วย /exec", true);
    } else if(remote && (remote.rev||0) > (db.rev||0)){
      remote.settings = remote.settings || {};
      remote.settings.gasUrl = url;
      db = remote;   // ชีตมีข้อมูลใหม่กว่า — ใช้ของชีตเป็นหลัก
    }
  } else { gasOK = false; }
  await storeSave(); closeModal(); renderAll();
  if(url && gasOK) toast("☁️ เชื่อมต่อ Google Sheet สำเร็จ! ข้อมูลจะซิงก์อัตโนมัติ");
  if(!url) toast("ยกเลิกการเชื่อมต่อ Google Sheet แล้ว");
}

  const courts = (s.courts&&s.courts.length)? s.courts : Array.from({length:nc},(_,i)=>({no:String(i+1), hours:2, price:DEFAULT_COURT_PRICE}));

    <button class="btn btn-ghost btn-block" onclick="closeModal()">◀️ ย้อนกลับ (ไม่บันทึก)</button>`);

function renderCourtDraft(){
  const el = $("courtDraftList"); if(!el) return;
  el.innerHTML = window.__courtDraft.map((c,i)=>`
    <div class="frow" style="align-items:flex-end;">
      <div class="field" style="flex:.8;"><label>คอร์ทที่</label><input type="text" value="${esc(c.no)}" oninput="__courtDraft[${i}].no=this.value"></div>

      <div class="field" style="flex:.4;"><button class="btn btn-danger btn-sm btn-block" onclick="rmCourtDraft(${i})">✕</button></div>
    </div>`).join("");
}
function addCourtDraft(){ window.__courtDraft.push({no:String(window.__courtDraft.length+1), hours:2, price:DEFAULT_COURT_PRICE}); renderCourtDraft(); }
function rmCourtDraft(i){ window.__courtDraft.splice(i,1); renderCourtDraft(); }
async function saveStartPlay(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  const courts = window.__courtDraft.filter(c=>String(c.no).trim()!=="");
  if(courts.length===0) return toast("ใส่ข้อมูลอย่างน้อย 1 คอร์ท", true);
  s.courts = courts.map(c=>({no:String(c.no).trim(), hours:Number(c.hours)||0, price:Number(c.price)||0}));
  s.shuttlePrice = Number($("spPrice").value)||0;
  s.shuttlesUsed = Number($("spUsed").value)||0;
  const starting = s.status==="open";
  if(s.status!=="done") s.status = "playing";   // นัดที่จบแล้ว: แก้ตัวเลขได้โดยไม่เปลี่ยนสถานะ
  await storeSave(); closeModal(); renderAll();
  if(s.status==="done") openPayment(sid);
  toast(starting? "เริ่มตีได้เลย! ช่วยกันบันทึกเซ็ตนะ 🏸":"บันทึกตัวเลขค่าใช้จ่ายแล้ว");
}

/* =====================================================
   EXCEL SYNC (ไฟล์ Excel คู่แอป)
   - Export: สร้าง smashbadminton-data.xlsx (อัตโนมัติเมื่อกดสรุปผล + กดเองได้)
   - Import: อ่านชีต AppData กลับเข้าแอปแบบครบถ้วน
   ===================================================== */
const XLSX_FILE = "smashbadminton-data.xlsx";
const APPDATA_MARK = "SMASH-APP-DATA-V1";
const STATUS_TH = { open:"เปิดรับลงชื่อ", playing:"กำลังตี", done:"จบแล้ว" };

function xlsxReady(){ return typeof XLSX !== "undefined"; }

function buildWorkbook(){
  const wb = XLSX.utils.book_new();

  /* --- อ่านก่อน --- */
  const info = [
    ["🏸 Smash Badminton Club — ไฟล์ข้อมูลคู่แอป"],
    [""],
    ["ไฟล์นี้ถูกสร้างโดยแอป smashbadminton-app.html โดยอัตโนมัติ"],
    ["ชีต Member / Sessions / Sets / Cost มีไว้เปิดดูใน Excel (สร้างจากข้อมูลจริงในแอป)"],
    ["ชีต AppData คือข้อมูลดิบของแอป — ห้ามแก้ไข มิฉะนั้นจะนำข้อมูลกลับเข้าแอปไม่ได้"],
    ["วิธีนำข้อมูลกลับเข้าแอป: เปิดแอป → แท็บนัดตี → การจัดการก๊วน → นำเข้าข้อมูลจาก Excel"],
    [""],
    ["ส่งออกเมื่อ", new Date().toLocaleString(loc())]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), "อ่านก่อน");

  /* --- Member (โครงเดียวกับไฟล์ Excel เดิม) --- */
  const cs = careerStats();
  const ranked = [...cs].filter(x=>x.sets>0).sort((a,b)=> b.wr-a.wr || b.w-a.w);
  const memRows = [["Code","Member","Win","Lose","Win Rate","Rank"]];
  db.members.forEach(m=>{
    const c = cs.find(x=>x.id===m.id) || {w:0,l:0,sets:0,wr:null};
    const rk = ranked.findIndex(x=>x.id===m.id);
    memRows.push([m.id, m.name, c.w, c.l, c.sets>0? Math.round(c.wr*1000)/1000 : "", rk>=0? rk+1 : ""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(memRows), "Member");

  /* --- Sessions --- */
  const sesRows = [["วันที่","สถานที่","เวลา","ผู้จัดการ","สถานะ","จำนวนคน","จำนวนเซ็ต","ลูกที่ใช้","ค่าคอร์ท (฿)","ค่าลูก (฿)","รวมทั้งหมด (฿)","วิธีหาร"]];
  [...db.sessions].sort((a,b)=> a.date.localeCompare(b.date)).forEach(s=>{
    sesRows.push([s.date, s.loc||"", s.time||"", nameOf(s.managerId), STATUS_TH[s.status]||s.status,
      s.attendees.length, (s.sets||[]).length, s.shuttlesUsed||0,
      courtCost(s), shuttleCost(s), totalCost(s), s.costMode==="hours"?"ตามชั่วโมงเล่น":"หารเท่ากัน"]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sesRows), "Sessions");

  /* --- Sets --- */
  const setRows = [["วันที่","คอร์ท","ทีม A","คะแนน A","ทีม B","คะแนน B","ผู้ชนะ","เปลี่ยนลูก","ผู้บันทึก"]];
  [...db.sessions].sort((a,b)=> a.date.localeCompare(b.date)).forEach(s=>{
    (s.sets||[]).forEach(x=>{
      const w = setWinner(x);
      setRows.push([s.date, x.court, x.teamA.map(nameOf).join(" + "), x.scoreA,
        x.teamB.map(nameOf).join(" + "), x.scoreB,
        w? (w==="A"? x.teamA : x.teamB).map(nameOf).join(" + ") : "-",
        x.shuttle? "ใช่":"", nameOf(x.recordedBy)]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(setRows), "Sets");

  /* --- Cost --- */
  const costRows = [["วันที่","สมาชิก","ชั่วโมงเล่น","ยอดที่ต้องจ่าย (฿)","จ่ายแล้ว"]];
  [...db.sessions].sort((a,b)=> a.date.localeCompare(b.date)).forEach(s=>{
    const split = costSplit(s);
    s.attendees.forEach(a=>{
      costRows.push([s.date, nameOf(a.memberId), a.hours||"", Math.round((split[a.memberId]||0)*100)/100,
        (s.paid && s.paid[a.memberId])? "✓":""]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(costRows), "Cost");

  /* --- AppData (ข้อมูลดิบสำหรับนำกลับเข้าแอป) --- */
  const json = JSON.stringify(db);
  const chunks = [];
  for(let i=0; i<json.length; i+=30000) chunks.push([json.slice(i, i+30000)]);
  const appRows = [[APPDATA_MARK], ["ห้ามแก้ไขชีตนี้ — ใช้สำหรับนำข้อมูลกลับเข้าแอป"], ...chunks];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(appRows), "AppData");

  return wb;
}

function exportExcel(auto){
  if(!xlsxReady()){ toast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต", true); return; }
  try{
    XLSX.writeFile(buildWorkbook(), XLSX_FILE);
    toast(auto? "📥 บันทึกลงไฟล์ Excel อัตโนมัติแล้ว (เช็คโฟลเดอร์ดาวน์โหลด)" : "📥 บันทึกไฟล์ Excel แล้ว");
  }catch(e){
    if(!auto) toast("บันทึก Excel ไม่สำเร็จ: "+e.message, true);
  }
}

async function importExcel(input){
  const f = input.files && input.files[0];
  input.value = "";
  if(!f) return;
  if(!(isAdmin()||isDefaultMgr())) return toast("เฉพาะ Admin หรือผู้จัดการที่นำเข้าข้อมูลได้", true);
  if(!xlsxReady()) return toast("โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต", true);
  try{
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf);
    const ws = wb.Sheets["AppData"];
    if(!ws) return toast("ไฟล์นี้ไม่มีชีต AppData — ต้องเป็นไฟล์ที่แอปนี้บันทึกไว้", true);
    const rows = XLSX.utils.sheet_to_json(ws, {header:1});
    if(!rows.length || String(rows[0][0])!==APPDATA_MARK) return toast("รูปแบบชีต AppData ไม่ถูกต้อง", true);
    const json = rows.slice(2).map(r=> r[0]==null? "" : String(r[0])).join("");
    const parsed = JSON.parse(json);
    if(!Array.isArray(parsed.members) || !Array.isArray(parsed.sessions)) return toast("ข้อมูลในไฟล์ไม่สมบูรณ์", true);
    if(!confirm("นำเข้าข้อมูลจาก Excel?\nข้อมูลปัจจุบันในแอปจะถูกแทนที่ด้วยข้อมูลในไฟล์\n(สมาชิก "+parsed.members.length+" คน, นัด "+parsed.sessions.length+" นัด)")) return;
    parsed.rev = Math.max(parsed.rev||0, (db.rev||0)) ;
    db = parsed;
    if(!db.settings) db.settings = {};
    await storeSave();
    if(meId && !mem(meId)){ toast("นำเข้าสำเร็จ — บัญชีที่ล็อกอินไม่อยู่ในข้อมูลใหม่ กรุณาล็อกอินอีกครั้ง"); logout(); return; }
    renderAll();
    toast("📤 นำเข้าข้อมูลจาก Excel สำเร็จ");
  }catch(e){ toast("นำเข้าไม่สำเร็จ: "+e.message, true); }
}

    ${mvps.length? `<div class="mvp-band"><span class="mvp-star">⭐</span><div style="flex:1;">
      <div class="mvp-cap">MVP ประจำนัด</div>

      <div class="muted" style="font-size:11px; margin-top:2px;">ชนะ ${st[mvps[0]].w} เซ็ต • แต้มต่าง ${st[mvps[0]].pf-st[mvps[0]].pa>0?"+":""}${st[mvps[0]].pf-st[mvps[0]].pa} — คิดจากเซ็ตชนะ ถ้าเสมอใช้แต้มต่างตัดสิน</div>
    </div></div>`:""}

    <div class="statgrid" style="margin:0 0 12px;">
      <div class="statbox"><div class="v">${s.attendees.length}</div><div class="l">ผู้เล่น</div></div>
      <div class="statbox"><div class="v">${(s.sets||[]).length}</div><div class="l">เซ็ตทั้งหมด</div></div>
      <div class="statbox"><div class="v">${s.shuttlesUsed||0}</div><div class="l">ลูกที่ใช้</div></div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <h3>📊 สถิติรายคน <span class="muted" style="font-weight:400; font-size:11px;">(เรียงจากชนะมากสุด • ± = แต้มได้−แต้มเสีย)</span></h3>
      <table class="tbl">
        <tr><th>ผู้เล่น</th><th style="text-align:center;">เซ็ต</th><th style="text-align:center;">ชนะ</th><th style="text-align:center;">แพ้</th><th style="text-align:center;">±</th><th style="text-align:center;">Win%</th></tr>
        ${statRows || '<tr><td colspan="6" class="muted">ไม่มีข้อมูล</td></tr>'}

    </div>

    ${isAdmin() && (s.sets||[]).length? `

      ${(s.sets||[]).map(x=>{
        const w = setWinner(x);
        return `<div class="set-card">
          <div class="set-teams">
            <div class="set-team ${w==="A"?"w":""}">${teamLabel(x.teamA)}</div>

/* ---------- หน้าการจ่ายเงิน (แยกจากสรุปผล) ---------- */
function openPayment(sid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  histOpen = sid;
  modal(renderPaymentHtml(s));
}
function renderPaymentHtml(s){
  const split = costSplit(s);
  const total = totalCost(s);
  const canMg = canManage(s);

  const costRows = s.attendees.map(a=>{
    const m = mem(a.memberId); if(!m) return "";
    const mid = a.memberId;
    const amt = split[mid]||0;
    const paid = !!(s.paid && s.paid[mid]);
    const req = s.payReq && s.payReq[mid];
    const info = s.payInfo && s.payInfo[mid];
    let st;
    if(paid){
      st = `<span class="tag tag-paid" ${canMg?`onclick="togglePaid('${s.id}','${mid}')"`:'style="cursor:default;"'}>จ่ายแล้ว ✓${info? (info.method==="cash"?" 💵": info.method==="slip"?" 🧾":""):""}</span>`;
      if(info && info.slip) st += ` <span style="cursor:pointer;" title="ดูสลิป" onclick="viewSlip('${s.id}','${mid}')">👁️</span>`;
    } else if(req){
      st = `<span class="tag tag-pending" style="cursor:pointer;" onclick="openPayReview('${s.id}','${mid}')">⏳ รออนุมัติ ${req.method==="cash"?"💵":"🧾"}</span>`;
    } else {
      const nudged = s.payNudge && s.payNudge[mid];
      st = `<span class="tag tag-unpaid" ${canMg?`onclick="openUnpaidAction('${s.id}','${mid}')"`:'style="cursor:default;"'}>ยังไม่จ่าย${nudged?" 📣":""}</span>`;
    }
    return `<tr>
      <td style="cursor:pointer;" onclick="payRowClick('${s.id}','${mid}')"><u style="text-decoration-color:rgba(198,242,78,.5);">${m.emoji} ${esc(m.name)}</u> ${hasOverride(a)?`<span class="tag tag-mgr" style="font-size:9px; padding:1px 5px;">กำหนดเอง</span>`:""} ${s.costMode==="hours"&&!hasOverride(a)?`<span class="muted">(${a.hours} ชม.)</span>`:""}</td>
      <td style="text-align:right; font-weight:700;">${money(amt)}</td>
      <td style="text-align:right;">${st}</td>
    </tr>`;
  }).join("");

  // กล่องชำระเงินของฉัน (เมื่อสรุปค่าใช้จ่ายแล้วและยังไม่จ่าย)
  const myAtt = s.attendees.some(a=>a.memberId===meId);
  const myPaid = !!(s.paid && s.paid[meId]);
  const myReq = s.payReq && s.payReq[meId];
  let payBox = "";
  if(myAtt && !myPaid && total>0){
    payBox = myReq? `
      <div class="card" style="margin-bottom:12px; border-color:rgba(255,194,75,.5);">
        <h3>💰 การชำระของฉัน</h3>
        <p class="muted" style="margin:0 0 10px;">⏳ แจ้ง${myReq.method==="cash"?"จ่ายเงินสด":"โอนเงิน (แนบสลิป)"}แล้ว — รอผู้จัดการกดอนุมัติ${myReq.note? `<br>📝 <span class="notx">${esc(myReq.note)}</span>`:""}</p>
        <div class="frow">
          <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openPayReview('${s.id}','${meId}')">👁️ ดูรายละเอียด</button>
          <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openPayNote('${s.id}')">📝 ${myReq.note? "แก้":"เขียน"}ข้อความ</button>
          <button class="btn btn-danger btn-sm" style="flex:1;" onclick="cancelPayReq('${s.id}')">ยกเลิกคำขอ</button>
        </div>
      </div>` : `
      <div class="card" style="margin-bottom:12px; border-color:rgba(198,242,78,.5);">
        <h3>💰 การชำระของฉัน — ${money(split[meId]||0)}</h3>
        <div class="frow">
          <button class="btn btn-lime btn-sm" style="flex:1;" onclick="openPaySlip('${s.id}')">🧾 แนบสลิปโอนเงิน</button>
          <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="payCash('${s.id}')">💵 แจ้งจ่ายเงินสด</button>
        </div>
        <p class="muted" style="margin:8px 0 0; font-size:11.5px;">แนบสลิปแล้วระบบจะอ่านยอดเงินให้อัตโนมัติ จากนั้นผู้จัดการกดอนุมัติ</p>
      </div>`;
  }

  const hourEdit = s.costMode==="hours" && canMg ? s.attendees.map(a=>{
    const m = mem(a.memberId); if(!m) return "";
    return `<div class="court-line"><span style="flex:1;">${m.emoji} ${esc(m.name)}</span>
      <input type="number" step="0.5" min="0" value="${a.hours}" style="width:80px; text-align:center;" onchange="setAttHours('${s.id}','${a.memberId}',this.value)">
      <span class="muted">ชม.</span></div>`;
  }).join("") : "";

  const paidCount = s.attendees.filter(a=> s.paid && s.paid[a.memberId]).length;

  return `
    <div class="modal-head"><h3>💰 การจ่ายเงิน — นัด ${fmtDateShort(s.date)}</h3><button class="mclose" onclick="closeModal()">✕</button></div>

    <div class="sum-total">
      <div class="muted">ค่าใช้จ่ายรวมทั้งนัด</div>
      <div class="n">${money(total)}</div>
      <div class="muted">คอร์ท ${money(courtCost(s))} + ลูก ${money(shuttleCost(s))} • จ่ายแล้ว ${paidCount}/${s.attendees.length} คน</div>
    </div>

    ${canMg? `<div class="frow" style="margin-bottom:10px;">
      <button class="btn btn-sm ${s.costMode!=="hours"?"btn-lime":"btn-ghost"}" style="flex:1;" onclick="setCostMode('${s.id}','equal')">หารเท่ากัน</button>
      <button class="btn btn-sm ${s.costMode==="hours"?"btn-lime":"btn-ghost"}" style="flex:1;" onclick="setCostMode('${s.id}','hours')">หารตามชั่วโมง</button>
    </div>`:""}

    ${hourEdit? `<div class="card" style="margin-bottom:12px;"><h3>⏱️ ชั่วโมงเล่น</h3>${hourEdit}</div>`:""}

    ${payBox}
    <div class="card" style="margin-bottom:0;">
      <h3>💸 รายคน</h3>
      <table class="tbl">${costRows || '<tr><td class="muted">ไม่มีผู้เข้าร่วม</td></tr>'}</table>
    </div>

    <div style="height:12px;"></div>
    ${canMg? `<button class="btn btn-blue btn-block" onclick="openStartPlay('${s.id}')">✏️ แก้ไขตัวเลขค่าคอร์ท / ค่าลูก</button><div style="height:8px;"></div>`:""}
    ${canMg? `<button class="btn btn-blue btn-block" onclick="openAdjustPay('${s.id}')">✏️ ปรับยอดจ่ายรายคน / ถอนชื่อคนไม่ได้มาตี</button><div style="height:8px;"></div>`:""}
    ${canMg? `<button class="btn btn-ghost btn-block" onclick="copyPaySummary('${s.id}')">📋 คัดลอกสรุปค่าใช้จ่าย → วางในไลน์กลุ่ม</button><div style="height:8px;"></div>`:""}
    <button class="btn btn-ghost btn-block" onclick="openPayHistory()">🧾 ประวัติการจ่ายเงินทั้งหมด</button>
    <div style="height:8px;"></div>
    <div class="frow">
      <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openSummary('${s.id}')">📊 สรุปผล</button>
      <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="closeModal()">◀️ ย้อนกลับ</button>
    </div>`;
}

/* ---------- ปุ่มเมนู "จ่ายเงินค่าตี" — เปิดหน้าการจ่ายเงินของนัดที่เกี่ยวข้องที่สุด ---------- */
function openPayNow(){
  const done = db.sessions.filter(s=>s.status==="done").sort((a,b)=> b.date.localeCompare(a.date));
  if(!done.length) return toast("ยังไม่มีนัดที่จบ");
  const owe = done.find(s=> s.attendees.some(a=>a.memberId===meId) && !(s.paid && s.paid[meId]));
  openPayment((owe || done[0]).id);
}

/* ---------- แจ้งจ่ายเงิน (คลิกชื่อในตารางรายคน) ---------- */
function payRowClick(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  if(s.paid && s.paid[mid]){
    const info = s.payInfo && s.payInfo[mid];
    if(info && info.slip) return viewSlip(sid, mid);
    return toast("จ่ายแล้ว ✓");
  }
  if(s.payReq && s.payReq[mid]) return openPayReview(sid, mid);
  openPayFor(sid, mid);
}
function openPayFor(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); const m = mem(mid); if(!s || !m) return;
  const amt = payAmt(s, mid);
  modal(`
    <div class="modal-head"><h3>💸 แจ้งจ่ายเงิน — <span class="notx">${m.emoji} ${esc(m.name)}</span></h3><button class="mclose" onclick="closeModal()">✕</button></div>
    ${mid!==meId? `<p class="muted" style="margin-top:0;">แจ้งแทนเพื่อนได้ — ผู้จัดการจะตรวจและกดอนุมัติอีกครั้ง</p>`:""}
    <div class="row" style="margin-bottom:12px;"><span class="muted">ยอดที่ต้องจ่าย</span><b style="font-size:18px; color:var(--lime);">${money(amt)}</b></div>
    <button class="btn btn-lime btn-block" onclick="openPaySlip('${sid}','${mid}')">🧾 แนบสลิปโอนเงิน</button>
    <div style="height:8px;"></div>
    <button class="btn btn-blue btn-block" onclick="payCash('${sid}','${mid}')">💵 แจ้งจ่ายเงินสด</button>
    ${canManage(s)? `<div style="height:8px;"></div><button class="btn btn-ghost btn-block" onclick="openUnpaidAction('${sid}','${mid}')">⚙️ ตัวเลือกผู้จัดการ (บันทึกรับเงิน / ทวง)</button>`:""}
    <div style="height:8px;"></div>
    <button class="btn btn-ghost btn-block" onclick="openPayment('${sid}')">◀️ ย้อนกลับ</button>`);
}

/* ---------- ประวัติการจ่ายเงินทั้งหมด ---------- */
function openPayHistory(){
  const items = [];
  db.sessions.filter(s=>s.status==="done").forEach(s=>{
    const split = costSplit(s);
    s.attendees.forEach(a=>{
      const mid = a.memberId;
      if(!(s.paid && s.paid[mid])) return;
      const info = (s.payInfo && s.payInfo[mid]) || {};
      items.push({ sid:s.id, date:s.date, mid, amt:split[mid]||0, method:info.method||"", by:info.approvedBy, at:info.approvedAt||info.at||0, slip:info.slip||null });
    });
  });
  items.sort((a,b)=> (b.at||0)-(a.at||0) || b.date.localeCompare(a.date));
  const M = { slip:"🧾 โอน", cash:"💵 สด", manual:"✓ ผู้จัดการบันทึก" };
  const rows = items.map(it=>`
    <div class="court-line" style="cursor:pointer;" onclick="openPayment('${it.sid}')">
      <span style="flex:1;">${emojiOf(it.mid)} ${esc(nameOf(it.mid))}<br><span class="muted" style="font-size:12px;">นัด ${fmtDateShort(it.date)} • ${M[it.method]||"จ่ายแล้ว"}${it.by? " • อนุมัติโดย "+esc(nameOf(it.by)):""}</span></span>
      <b style="color:var(--lime);">${money(it.amt)}</b>

async function rmAttDone(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s || !canManage(s)) return;
  const i = s.attendees.findIndex(a=>a.memberId===mid); if(i<0) return;

  if(s.payReq && s.payReq[mid]) return toast(nameOf(mid)+" มีคำขอรออนุมัติ — ปฏิเสธคำขอก่อนจึงถอนชื่อได้", true);
  if((s.sets||[]).some(x=> x.teamA.includes(mid) || x.teamB.includes(mid))) return toast("มีผลเซ็ตของ "+nameOf(mid)+" บันทึกไว้ — ต้องลบเซ็ตนั้นก่อน", true);
  if(!confirm("ถอนชื่อ "+nameOf(mid)+" ออกจากนัดนี้?\nค่าใช้จ่ายจะเฉลี่ยใหม่ให้คนที่เหลืออัตโนมัติ")) return;

async function togglePaid(sid, mid){
  const s = db.sessions.find(x=>x.id===sid); if(!s) return;
  if(!canManage(s)) return;   // แก้สถานะโดยตรง: เฉพาะ Admin/ผู้จัดการ
  if(!s.paid) s.paid = {};
  if(s.paid[mid]){
    // จ่ายแล้ว → ยกเลิก: ถามยืนยันกันเผลอแตะ และเก็บสลิปกลับเป็น "รออนุมัติ" ไม่ลบทิ้ง
    if(!confirm("ยกเลิกสถานะ \"จ่ายแล้ว\" ของ "+nameOf(mid)+"?\n(ถ้ามีสลิป สลิปจะกลับไปอยู่สถานะรออนุมัติ ไม่หายไป)")) return;
    const info = s.payInfo && s.payInfo[mid];
    if(info && (info.slip || info.method==="slip" || info.method==="cash")){
      if(!s.payReq) s.payReq = {};
      s.payReq[mid] = { method:info.method||"slip", slip:info.slip||null, amountRead:info.amountRead!=null? info.amountRead:null, matched:false, note:info.note||"", at:info.at||Date.now(), by:info.approvedBy||meId };
    }
    s.paid[mid] = false;
    if(s.payInfo) delete s.payInfo[mid];
  } else {
    s.paid[mid] = true;
    if(!s.payInfo) s.payInfo = {};
    // ถ้ามีคำขอค้างอยู่ (มีสลิป/ข้อความ) ให้ใช้ข้อมูลนั้น ไม่ทับด้วย manual เปล่าๆ
    const req = s.payReq && s.payReq[mid];
    if(req) s.payInfo[mid] = { method:req.method, slip:req.slip||null, amountRead:req.amountRead!=null? req.amountRead:null, note:req.note||"", at:req.at, approvedBy:meId, approvedAt:Date.now() };
    else if(!s.payInfo[mid]) s.payInfo[mid] = { method:"manual", at:Date.now(), approvedBy:meId };
    if(s.payReq) delete s.payReq[mid];
    if(s.payNudge) delete s.payNudge[mid];
  }
  await storeSave();
  modal(renderPaymentHtml(s)); renderAll();
}

function pendingApprovals(){
